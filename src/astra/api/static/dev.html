<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra · 开发者控制台</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-2: #22262e;
    --border: #2e333d;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #5cf5a8;
    --warn: #efaa17;
    --danger: #e8463a;
    --user: #4a9eff;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--border);
                border-radius: 999px; padding: 1px 8px; }
  .status { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--accent); }
  .dot.degraded { background: var(--warn); }
  .dot.down { background: var(--danger); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  .pane:last-child { border-right: 0; }
  .pane > h2 {
    margin: 0; padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .pane > h2 .spacer { flex: 1; }
  .scroll { flex: 1; overflow-y: auto; padding: 12px 16px; min-height: 0; }
  .msg { margin-bottom: 10px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .msg .bubble { padding: 8px 10px; border-radius: 8px; background: var(--panel-2);
                 white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { border-left: 2px solid var(--user); }
  .msg.assistant .bubble { border-left: 2px solid var(--accent); }
  .msg.failed .bubble { border-left: 2px solid var(--danger); }
  .msg .meta { font-size: 11px; color: var(--muted); margin-top: 3px; font-family: var(--mono); }
  .evt { font-family: var(--mono); font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--border);
         display: flex; gap: 8px; }
  .evt .t { color: var(--accent); flex: none; min-width: 190px; }
  .evt .p { color: var(--muted); word-break: break-all; }
  .evt.error .t { color: var(--danger); }
  .evt.turn-failed .t { color: var(--danger); }
  form { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  input[type=text] {
    flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; font: inherit; min-width: 0;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 600; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .row label { cursor: pointer; }
  details { border-top: 1px solid var(--border); }
  details > summary {
    cursor: pointer; padding: 8px 16px; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em; background: var(--panel);
  }
  details .body { padding: 10px 16px 14px; font-size: 12px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-family: var(--mono); }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-all; }
  .vocab { margin-top: 8px; }
  .vocab code { background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
                padding: 1px 5px; margin: 0 3px 3px 0; display: inline-block; font-size: 11px; }
  .hint { color: var(--muted); font-size: 12px; padding: 0 16px 10px; }
  .mem { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
         background: var(--panel-2); }
  .mem .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .mem .type { font-family: var(--mono); font-size: 11px; color: var(--accent);
               border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
  .mem .score { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: auto; }
  .mem .text { white-space: pre-wrap; word-break: break-word; }
  .mem .foot { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-top: 4px;
               display: flex; align-items: center; gap: 8px; }
  .mem .foot button { padding: 2px 8px; font-size: 11px; border-radius: 6px; margin-left: auto; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .toolbar button { padding: 4px 10px; font-size: 12px; }
  .state-group { margin-bottom: 10px; }
  .state-heading { color: var(--muted); font-size: 11px; text-transform: uppercase;
                   letter-spacing: .06em; margin-bottom: 4px; }
  .kv-row { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center;
            gap: 8px; font-family: var(--mono); font-size: 11px; margin-bottom: 3px; }
  .kv-row .k { color: var(--muted); }
  .kv-row .bar { height: 6px; background: var(--panel-2); border: 1px solid var(--border);
                 border-radius: 999px; overflow: hidden; }
  .kv-row .fill { display: block; height: 100%; background: var(--accent); }
  .kv-row .v { text-align: right; }
  .talk { padding: 6px 14px; font-size: 12px; user-select: none; touch-action: none; }
  .talk.active { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .row + .row { margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>Astra</h1>
  <span class="tag">开发者控制台</span>
  <div class="status" id="status"></div>
</header>

<main>
  <section class="pane">
    <h2>对话<span class="spacer"></span>
      <button type="button" id="load-history">拉取历史</button>
    </h2>
    <div class="scroll" id="chat"></div>
    <form id="composer">
      <input type="text" id="text" placeholder="说点什么…（回车发送）" autocomplete="off">
      <button type="submit" class="primary" id="send">发送</button>
    </form>
    <div class="hint">
      <span class="row">
        <input type="radio" name="mode" id="mode-ws" value="ws" checked>
        <label for="mode-ws">WebSocket（看事件流）</label>
        <input type="radio" name="mode" id="mode-sync" value="sync">
        <label for="mode-sync">同步（看完整 TurnResponse）</label>
      </span>
      <span class="row">
        <input type="checkbox" id="voice-mode">
        <label for="voice-mode">语音模式</label>
        <button type="button" class="talk" id="talk" disabled>按住说话</button>
        <span class="chip" id="voice-status">未开启</span>
      </span>
    </div>
  </section>

  <section class="pane">
    <h2>事件流<span class="spacer"></span>
      <button type="button" id="clear-events">清空</button>
    </h2>
    <div class="scroll" id="events"></div>
    <details>
      <summary>运行配置与协议词表</summary>
      <div class="body" id="config">加载中…</div>
    </details>
    <details id="memory-panel">
      <summary>记忆（M2）</summary>
      <div class="body">
        <div class="toolbar">
          <label class="row">
            <input type="checkbox" id="memory-enabled">
            <span>启用记忆</span>
          </label>
          <span class="chip" id="memory-count">…</span>
          <button type="button" id="memory-refresh">刷新</button>
          <button type="button" id="memory-clear">清空全部</button>
        </div>
        <div id="memory-list"></div>
      </div>
    </details>
    <details id="state-panel">
      <summary>状态（M3）</summary>
      <div class="body">
        <div class="toolbar">
          <span class="chip" id="state-updated">…</span>
          <button type="button" id="state-refresh">刷新</button>
        </div>
        <div id="state-list"></div>
        <div class="hint" style="padding:8px 0 0">
          只读：状态由事件驱动（用户事件规则 + 已表达的情绪），没有写入端点。
        </div>
      </div>
    </details>
  </section>
</main>

<script>
"use strict";

const CANONICAL = ["api", "database", "llm", "stt", "tts"];

const el = (id) => document.getElementById(id);

const state = {
  sessionId: null,
  conversationId: null,
  socket: null,
  busy: false,
};

/* ── 语音（M4）───────────────────────────────────────── */

//: 采集采样率。服务端**不做重采样**，声明的格式与它的配置不符会被拒绝。
const INPUT_SAMPLE_RATE = 16000;

const audio = {
  mic: null,          // 采集用 AudioContext（16 kHz）
  stream: null,       // MediaStream
  processor: null,    // ScriptProcessorNode
  playback: null,     // 播放用 AudioContext（采样率由 tts.started 决定）
  playbackRate: 0,
  nextPlayTime: 0,
  sources: new Set(),
  pending: 0,         // 本轮已收到的音频字节数（tts.started 的 chunk_count 自检用）
  expectedChunks: 0,
  chunks: 0,
};

function sendFrame(type, payload) {
  if (!state.socket || state.socket.readyState !== WebSocket.OPEN) return;
  state.socket.send(JSON.stringify({ type, version: 1, payload }));
}

function setVoiceStatus(text) {
  el("voice-status").textContent = text;
}

function setTalking(talking) {
  el("talk").classList.toggle("active", talking);
  el("talk").textContent = talking ? "松开结束" : "按住说话";
}

async function startRecording() {
  if (audio.processor) return true;

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
  });
  // 直接用 16 kHz 的 AudioContext，省掉自己写重采样
  const context = new AudioContext({ sampleRate: INPUT_SAMPLE_RATE });
  if (context.sampleRate !== INPUT_SAMPLE_RATE) {
    await context.close();
    stream.getTracks().forEach((track) => track.stop());
    addMessage("failed", `浏览器拒绝了 ${INPUT_SAMPLE_RATE} Hz 的采集，实际是 ${context.sampleRate} Hz。`, "");
    return false;
  }

  const source = context.createMediaStreamSource(stream);
  const processor = context.createScriptProcessor(4096, 1, 1);
  const mute = context.createGain();
  mute.gain.value = 0;              // 不把自己的声音放出来（否则会啸叫）
  processor.connect(mute);
  mute.connect(context.destination);

  processor.onaudioprocess = (event) => {
    const input = event.inputBuffer.getChannelData(0);
    const pcm = new Int16Array(input.length);
    for (let i = 0; i < input.length; i += 1) {
      pcm[i] = Math.round(Math.max(-1, Math.min(1, input[i])) * 32767);
    }
    if (state.socket && state.socket.readyState === WebSocket.OPEN) {
      state.socket.send(pcm.buffer);
    }
  };
  source.connect(processor);

  audio.mic = context;
  audio.stream = stream;
  audio.processor = processor;
  return true;
}

function stopRecording() {
  if (audio.processor) {
    audio.processor.onaudioprocess = null;
    audio.processor.disconnect();
    audio.processor = null;
  }
  if (audio.stream) {
    audio.stream.getTracks().forEach((track) => track.stop());
    audio.stream = null;
  }
  if (audio.mic) {
    audio.mic.close().catch(() => {});
    audio.mic = null;
  }
}

function stopPlayback() {
  for (const source of audio.sources) {
    try { source.stop(); } catch (error) { /* 已经播完的节点 stop 会抛，忽略 */ }
  }
  audio.sources.clear();
  audio.nextPlayTime = 0;
}

function ensurePlaybackContext(sampleRate) {
  if (audio.playback && audio.playbackRate === sampleRate) return audio.playback;
  stopPlayback();
  if (audio.playback) audio.playback.close().catch(() => {});
  audio.playback = new AudioContext({ sampleRate });
  audio.playbackRate = sampleRate;
  return audio.playback;
}

function playAudioChunk(buffer) {
  if (!audio.playback) return;

  const samples = new Int16Array(buffer);
  const audioBuffer = audio.playback.createBuffer(1, samples.length, audio.playbackRate);
  const channel = audioBuffer.getChannelData(0);
  for (let i = 0; i < samples.length; i += 1) channel[i] = samples[i] / 32768;

  const source = audio.playback.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audio.playback.destination);

  // 逐块排队播放：每块接在上一次结束的位置，听起来是连续的
  const startAt = Math.max(audio.playback.currentTime, audio.nextPlayTime);
  source.start(startAt);
  audio.nextPlayTime = startAt + audioBuffer.duration;

  audio.sources.add(source);
  source.onended = () => audio.sources.delete(source);
}

/* ── 工具 ───────────────────────────────────────────── */

function newUlid() {
  // 控制台只需要一个稳定的随机字符串；服务端不校验格式
  const alphabet = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes, (b) => alphabet[b % alphabet.length]).join("");
}

function line(parent, className, text) {
  const node = document.createElement("div");
  if (className) node.className = className;
  node.textContent = text;          // 一律用 textContent，避免把模型输出当 HTML 解析
  parent.appendChild(node);
  return node;
}

function atBottom(node) {
  return node.scrollHeight - node.scrollTop - node.clientHeight < 60;
}

/* ── Health ─────────────────────────────────────────── */

async function refreshHealth() {
  const box = el("status");
  try {
    const response = await fetch("/health");
    const health = await response.json();
    box.replaceChildren();

    const overall = document.createElement("span");
    overall.className = "chip";
    const dot = document.createElement("span");
    dot.className = "dot " + health.status;
    overall.append(dot, document.createTextNode("overall " + health.status));
    box.appendChild(overall);

    for (const name of CANONICAL) {
      const component = health.components[name];
      const chip = document.createElement("span");
      chip.className = "chip";
      const d = document.createElement("span");
      d.className = "dot " + component.status;
      chip.append(d, document.createTextNode(name + " " + component.status));
      if (component.latency_ms !== null && component.latency_ms !== undefined) {
        chip.appendChild(document.createTextNode(" " + Math.round(component.latency_ms) + "ms"));
      }
      box.appendChild(chip);
    }
    if (health.schema_version !== null) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = "schema v" + health.schema_version;
      box.appendChild(chip);
    }
  } catch (error) {
    box.replaceChildren();
    line(box, "chip", "health 不可达：" + error.message);
  }
}

/* ── 配置与词表 ─────────────────────────────────────── */

async function loadConfig() {
  const box = el("config");
  try {
    const config = await fetch("/v1/config").then((r) => r.json());
    box.replaceChildren();

    const kv = document.createElement("dl");
    kv.className = "kv";
    for (const key of ["companion_id", "user_id", "llm_provider", "llm_model",
                       "stt_provider", "tts_provider", "avatar_enabled"]) {
      const dt = document.createElement("dt");
      dt.textContent = key;
      const dd = document.createElement("dd");
      dd.textContent = String(config[key]);
      kv.append(dt, dd);
    }
    box.appendChild(kv);

    for (const [label, key] of [["情绪", "emotions"], ["动作", "actions"], ["音色", "voice_styles"]]) {
      const wrap = document.createElement("div");
      wrap.className = "vocab";
      const title = document.createElement("div");
      title.textContent = label + "（" + config[key].length + "）";
      wrap.appendChild(title);
      for (const word of config[key]) {
        const code = document.createElement("code");
        code.textContent = word;
        wrap.appendChild(code);
      }
      box.appendChild(wrap);
    }
  } catch (error) {
    box.textContent = "加载失败：" + error.message;
  }
}

/* ── 记忆（M2）──────────────────────────────────────── */

function memoryRow(memory) {
  const wrap = document.createElement("div");
  wrap.className = "mem";

  const top = document.createElement("div");
  top.className = "top";
  const type = document.createElement("span");
  type.className = "type";
  type.textContent = memory.type;
  const score = document.createElement("span");
  score.className = "score";
  score.textContent = `imp ${memory.importance.toFixed(2)} · conf ${memory.confidence.toFixed(2)}`;
  top.append(type, score);

  const text = document.createElement("div");
  text.className = "text";
  text.textContent = memory.content;

  const foot = document.createElement("div");
  foot.className = "foot";
  const id = document.createElement("span");
  id.textContent = memory.id;
  const expires = document.createElement("span");
  expires.textContent = memory.expires_at ? "expires " + memory.expires_at.slice(0, 10) : "长期";
  const remove = document.createElement("button");
  remove.type = "button";
  remove.textContent = "删除";
  remove.addEventListener("click", () => {
    removeMemory(memory.id).catch((error) => addMessage("failed", String(error), ""));
  });
  foot.append(id, expires, remove);

  wrap.append(top, text, foot);
  return wrap;
}

async function loadMemories() {
  const list = el("memory-list");
  try {
    const [settings, page] = await Promise.all([
      fetch("/v1/memories/settings").then((r) => r.json()),
      fetch("/v1/memories").then((r) => r.json()),
    ]);
    el("memory-enabled").checked = settings.enabled;
    el("memory-count").textContent = page.total + " 条";

    list.replaceChildren();
    if (page.memories.length === 0) {
      line(list, "chip", "还没有记忆。告诉 AI 一个稳定偏好试试。");
      return;
    }
    for (const memory of page.memories) list.appendChild(memoryRow(memory));
  } catch (error) {
    list.textContent = "加载失败：" + error.message;
  }
}

async function removeMemory(memoryId) {
  const response = await fetch("/v1/memories/" + memoryId, { method: "DELETE" });
  if (!response.ok && response.status !== 204) {
    throw new Error("删除失败：HTTP " + response.status);
  }
  await loadMemories();
}

async function clearMemories() {
  const response = await fetch("/v1/memories/clear", { method: "POST" });
  if (!response.ok) throw new Error("清空失败：HTTP " + response.status);
  await loadMemories();
}

async function setMemoryEnabled(enabled) {
  const response = await fetch("/v1/memories/settings", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enabled }),
  });
  if (!response.ok) throw new Error("切换失败：HTTP " + response.status);
  await loadMemories();
}

/* ── 状态（M3）──────────────────────────────────────── */

const STATE_EMOTION_DIMS = ["happiness", "energy", "curiosity", "social_need",
                            "stress", "embarrassment", "excitement"];
const STATE_RELATIONSHIP_DIMS = ["familiarity", "trust", "affection", "reliance", "conflict"];

function stateRow(label, value) {
  const row = document.createElement("div");
  row.className = "kv-row";

  const name = document.createElement("span");
  name.className = "k";
  name.textContent = label;

  const bar = document.createElement("span");
  bar.className = "bar";
  const fill = document.createElement("span");
  fill.className = "fill";
  fill.style.width = Math.round(value * 100) + "%";
  bar.appendChild(fill);

  const number = document.createElement("span");
  number.className = "v";
  number.textContent = value.toFixed(2);

  row.append(name, bar, number);
  return row;
}

function stateGroup(title, dims, values) {
  const wrap = document.createElement("div");
  wrap.className = "state-group";
  const heading = document.createElement("div");
  heading.className = "state-heading";
  heading.textContent = title;
  wrap.appendChild(heading);
  for (const name of dims) wrap.appendChild(stateRow(name, values[name]));
  return wrap;
}

async function loadState() {
  const box = el("state-list");
  try {
    const state = await fetch("/v1/state").then((r) => r.json());
    el("state-updated").textContent = "更新于 " + state.emotion_updated_at.slice(11, 19);

    box.replaceChildren(
      stateGroup("Mood", STATE_EMOTION_DIMS, state.emotion),
      stateGroup("Relationship", STATE_RELATIONSHIP_DIMS, state.relationship)
    );
  } catch (error) {
    box.textContent = "加载失败：" + error.message;
  }
}

/* ── 事件流 ─────────────────────────────────────────── */

function appendEvent(event) {
  const box = el("events");
  const stick = atBottom(box);

  const cls = event.type === "turn.failed" || event.type === "error.protocol"
    ? "evt error" : "evt";
  const row = document.createElement("div");
  row.className = cls;

  const type = document.createElement("span");
  type.className = "t";
  type.textContent = event.type;

  const payload = document.createElement("span");
  payload.className = "p";
  payload.textContent = JSON.stringify(event.payload);

  row.append(type, payload);
  box.appendChild(row);

  if (stick) box.scrollTop = box.scrollHeight;
}

/* ── 对话渲染 ───────────────────────────────────────── */

function addMessage(kind, text, meta) {
  const box = el("chat");
  const stick = atBottom(box);

  const wrap = document.createElement("div");
  wrap.className = "msg " + kind;

  const who = document.createElement("div");
  who.className = "who";
  who.textContent = kind === "user" ? "你" : kind === "assistant" ? "Astra" : "系统";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  wrap.append(who, bubble);

  if (meta) {
    const metaNode = document.createElement("div");
    metaNode.className = "meta";
    metaNode.textContent = meta;
    wrap.appendChild(metaNode);
  }

  box.appendChild(wrap);
  if (stick) box.scrollTop = box.scrollHeight;
  return wrap;
}

function handleEvent(event) {
  appendEvent(event);
  const payload = event.payload || {};

  if (event.type === "conversation.created" || event.type === "turn.started") {
    if (payload.conversation_id) state.conversationId = payload.conversation_id;
  }

  if (event.type === "assistant.text.completed") {
    const emotion = payload.emotion || {};
    const action = payload.action || {};
    const voice = payload.voice || {};
    addMessage(
      "assistant",
      payload.reply || "",
      `emotion=${emotion.primary}(${emotion.intensity}) action=${action.name}(${action.intensity}) ` +
      `voice=${voice.style}/${voice.speed}/${voice.pitch}`
    );
  }

  if (event.type === "turn.failed") {
    addMessage("failed", payload.reply || payload.message || "", "code=" + payload.code);
  }

  if (event.type === "turn.completed") {
    addMessage(
      "system",
      "turn 完成",
      `retries=${payload.retries} degraded=${payload.degraded} total=${payload.total_ms}ms`
    );
    loadMemories().catch(() => {});
  }

  // ── 语音（M4）────────────────────────────────────────
  if (event.type === "stt.final") {
    addMessage("user", "（语音）" + (payload.text || ""), "stt.final");
    setVoiceStatus("已识别，等待回复…");
  }

  if (event.type === "tts.started") {
    ensurePlaybackContext(payload.sample_rate || 24000);
    audio.expectedChunks = payload.chunk_count || 0;
    audio.chunks = 0;
    setVoiceStatus(`播放中（${payload.duration_ms}ms）`);
  }

  if (event.type === "tts.completed") {
    if (payload.status === "failed") {
      setVoiceStatus("合成失败：" + payload.code);
    } else if (audio.chunks !== audio.expectedChunks) {
      // 队满时"淘汰最旧"可能丢掉音频中间帧——用 chunk_count 自检（ADR 0021 的已知局限）
      addMessage("system", "音频块数对不上", `收到 ${audio.chunks} / 期望 ${audio.expectedChunks}`);
      setVoiceStatus("播放中（有丢帧）");
    } else {
      setVoiceStatus("就绪");
    }
  }

  if (event.type === "turn.interrupted") {
    // 服务端只能停止"继续发送"；已经推过来的声音要客户端自己停（docs/10 §7 Scenario D）
    stopPlayback();
    setVoiceStatus("已被打断");
  }

  if (event.type === "error.protocol") {
    setVoiceStatus("协议错误：" + (payload.code || ""));
  }

  // 记忆 / 状态事件到达时顺手刷新面板——这是"子系统到底有没有在工作"最直接的观察点
  if (event.type.startsWith("memory.")) loadMemories().catch(() => {});
  if (event.type.startsWith("state.")) loadState().catch(() => {});
}

/* ── WebSocket ──────────────────────────────────────── */

function setBusy(busy) {
  state.busy = busy;
  el("send").disabled = busy;
}

function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host +
              "/ws/v1/session/" + state.sessionId;
  const socket = new WebSocket(url);
  // 音频走二进制帧：不设 binaryType 会拿到 Blob，还得再 await 一次才能读
  socket.binaryType = "arraybuffer";
  state.socket = socket;

  socket.addEventListener("open", () => {
    appendEvent({ type: "ws.connected", payload: { url } });
    // 重连后补发一次 voice mode——否则断线期间切过的开关会丢
    sendFrame("session.voice_mode.set", { enabled: el("voice-mode").checked });
    syncTalkButton();
  });
  socket.addEventListener("close", () => {
    appendEvent({ type: "ws.closed", payload: {} });
    setBusy(false);
    stopRecording();
    stopPlayback();
    syncTalkButton();
  });
  socket.addEventListener("error", () => appendEvent({ type: "ws.error", payload: {} }));
  socket.addEventListener("message", (message) => {
    if (message.data instanceof ArrayBuffer) {
      audio.chunks += 1;
      playAudioChunk(message.data);
      return;
    }
    let event;
    try {
      event = JSON.parse(message.data);
    } catch (error) {
      appendEvent({ type: "ws.unparsable", payload: { error: String(error) } });
      return;
    }
    handleEvent(event);
    if (event.type === "turn.completed" || event.type === "turn.failed") setBusy(false);
  });
}

/* ── 语音面板（M4）───────────────────────────────────── */

function socketOpen() {
  return state.socket !== null && state.socket.readyState === WebSocket.OPEN;
}

function syncTalkButton() {
  el("talk").disabled = !el("voice-mode").checked || !socketOpen();
}

async function beginTalk() {
  if (!el("voice-mode").checked || !socketOpen() || audio.processor) return;

  setTalking(true);
  setVoiceStatus("正在听…");

  let started = false;
  try {
    started = await startRecording();
  } catch (error) {
    addMessage("failed", "拿不到麦克风：" + error.message, "");
  }
  if (!started) {
    setTalking(false);
    setVoiceStatus("麦克风不可用");
    return;
  }
  // 先声明格式再送字节——服务端按这条声明解释后面的二进制帧
  sendFrame("input.audio.started", {
    encoding: "pcm16", sample_rate: INPUT_SAMPLE_RATE, channels: 1,
  });
}

function endTalk() {
  if (!audio.processor) return;
  sendFrame("input.audio.stopped", {});
  stopRecording();
  setTalking(false);
  setVoiceStatus("识别中…");
}

function sendOverSocket(text) {
  state.socket.send(JSON.stringify({
    type: "input.user_text", version: 1, payload: { text },
  }));
}

/* ── 同步模式 ───────────────────────────────────────── */

async function sendSync(text) {
  const body = { content: text };
  if (state.conversationId) body.conversation_id = state.conversationId;

  const response = await fetch("/v1/chat/turns", {
    method: "POST",
    headers: { "Content-Type": "application/json; charset=utf-8" },
    body: JSON.stringify(body),
  });
  const result = await response.json();

  state.conversationId = result.conversation_id;
  addMessage("user", text);

  if (result.status === "ok") {
    addMessage(
      "assistant",
      result.reply,
      `emotion=${result.response.emotion.primary} action=${result.response.action.name} ` +
      `stubs=${result.stubs_used.join(",")} retries=${result.retries} ` +
      `degraded=${result.degraded} total=${result.timings.total_ms}ms ` +
      `mem=${result.memories_retrieved}/${result.memories_created}`
    );
  } else {
    addMessage("failed", result.reply, `code=${result.failure.code} recoverable=${result.failure.recoverable}`);
  }
  appendEvent({ type: "sync.turn", payload: result });
  loadMemories().catch(() => {});
}

/* ── 历史 ───────────────────────────────────────────── */

async function loadHistory() {
  if (!state.conversationId) {
    addMessage("system", "还没有会话——先发一条消息。", "");
    return;
  }
  const response = await fetch("/v1/conversations/" + state.conversationId + "/messages");
  if (!response.ok) {
    addMessage("failed", "拉取历史失败：HTTP " + response.status, "");
    return;
  }
  const history = await response.json();
  const box = el("chat");
  box.replaceChildren();
  for (const message of history.messages) {
    addMessage(
      message.role === "user" ? "user" : "assistant",
      message.content,
      message.id + (message.metadata.status ? " status=" + message.metadata.status : "")
    );
  }
}

/* ── 启动 ───────────────────────────────────────────── */

function currentMode() {
  return el("mode-sync").checked ? "sync" : "ws";
}

el("composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = el("text");
  const text = input.value.trim();
  if (!text || state.busy) return;

  input.value = "";
  setBusy(true);

  if (currentMode() === "sync") {
    addMessage("user", text);
    try {
      await sendSync(text);
    } catch (error) {
      addMessage("failed", "请求失败：" + error.message, "");
    } finally {
      setBusy(false);
    }
    return;
  }

  addMessage("user", text);
  sendOverSocket(text);
});

el("load-history").addEventListener("click", () => {
  loadHistory().catch((error) => addMessage("failed", String(error), ""));
});

el("clear-events").addEventListener("click", () => el("events").replaceChildren());

el("memory-refresh").addEventListener("click", () => {
  loadMemories().catch((error) => addMessage("failed", String(error), ""));
});

el("memory-clear").addEventListener("click", () => {
  clearMemories().catch((error) => addMessage("failed", String(error), ""));
});

el("memory-enabled").addEventListener("change", (event) => {
  setMemoryEnabled(event.target.checked).catch((error) => addMessage("failed", String(error), ""));
});

// 展开面板时才拉数据，避免每次打开控制台都多打两个请求
el("memory-panel").addEventListener("toggle", (event) => {
  if (event.target.open) loadMemories().catch(() => {});
});

el("state-refresh").addEventListener("click", () => {
  loadState().catch((error) => addMessage("failed", String(error), ""));
});

el("state-panel").addEventListener("toggle", (event) => {
  if (event.target.open) loadState().catch(() => {});
});

/* ── 语音面板的事件绑定（M4）─────────────────────────── */

el("voice-mode").addEventListener("change", (event) => {
  const enabled = event.target.checked;
  sendFrame("session.voice_mode.set", { enabled });
  syncTalkButton();
  setVoiceStatus(enabled ? "已开启（回复会合成语音）" : "未开启");
  if (!enabled) {
    endTalk();
    stopPlayback();
  }
});

// pointer 事件同时覆盖鼠标与触屏；pointerleave 兜住"按着拖出去松手"
el("talk").addEventListener("pointerdown", (event) => {
  event.preventDefault();
  beginTalk().catch((error) => addMessage("failed", String(error), ""));
});
el("talk").addEventListener("pointerup", (event) => {
  event.preventDefault();
  endTalk();
});
el("talk").addEventListener("pointercancel", () => endTalk());
el("talk").addEventListener("pointerleave", () => endTalk());

state.sessionId = newUlid();
addMessage("system", "开发者控制台就绪。输入文字回车发送。", "session=" + state.sessionId);
connect();
refreshHealth();
loadConfig();
loadMemories();
loadState();
setInterval(refreshHealth, 5000);
</script>
</body>
</html>
