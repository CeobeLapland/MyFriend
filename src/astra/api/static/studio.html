function reportPersonaError(error) {
  personaNote("danger", "人格页出错：" + String((error && error.message) || error));
}

function personaNote(kind, text) {
  const banner = el("persona-banner");
  banner.replaceChildren(node("p", "note " + kind, text));
  banner.hidden = false;
}

function clearPersonaBanner() {
  el("persona-banner").hidden = true;
}

function personaEntry(personaId) {
  return app.personas.list.find((item) => item.id === personaId) || null;
}

function markPersonaDirty() {
  app.personas.dirty = true;
}

function peField(controlId, labelText) {
  const row = node("div", "cfg-row");
  row.appendChild(node("span", "cfg-label", labelText));
  const control = node("input");
  control.type = "text";
  control.id = controlId;
  control.autocomplete = "off";
  control.addEventListener("input", markPersonaDirty);
  row.appendChild(control);
  return row;
}

function peTextarea(controlId, labelText) {
  const row = node("div", "cfg-row");
  row.appendChild(node("span", "cfg-label", labelText));
  const area = node("textarea");
  area.id = controlId;
  area.spellcheck = false;
  area.rows = 6;
  area.addEventListener("input", markPersonaDirty);
  row.appendChild(area);
  return row;
}

function addTraitRow(name, value) {
  const row = node("div", "pe-trait");
  const key = node("input", "pe-trait-key");
  key.type = "text";
  key.value = name;
  key.placeholder = "trait 名（英文，例如 curious）";
  key.addEventListener("input", markPersonaDirty);

  const amount = node("input", "pe-trait-value");
  amount.type = "number";
  amount.min = "0";
  amount.max = "1";
  amount.step = "0.01";
  amount.value = String(value);
  amount.addEventListener("input", markPersonaDirty);

  const remove = node("button", null, "删");
  remove.type = "button";
  remove.title = "删掉这条 trait";
  remove.addEventListener("click", () => { row.remove(); markPersonaDirty(); });

  row.append(key, amount, remove);
  el("pe-traits").appendChild(row);
}

/* 编辑器只建一次，之后靠填值复用——重建会丢焦点 */
function buildPersonaEditor() {
  const box = el("persona-editor");
  box.replaceChildren();

  const identity = node("section", "cfg-group");
  identity.appendChild(node("h2", null, "身份（Layer 1）"));
  identity.appendChild(peField("pe-name", "name（英文标识）"));
  identity.appendChild(peField("pe-display", "display_name（界面显示名）"));
  identity.appendChild(peField("pe-pronouns", "pronouns（人称 / 自称）"));
  identity.appendChild(peField("pe-version", "version"));
  identity.appendChild(peTextarea("pe-self", "self_description（她是谁，会进 prompt）"));
  identity.appendChild(peTextarea("pe-backstory", "backstory（背景，留空 = 不写）"));
  box.appendChild(identity);

  const traits = node("section", "cfg-group");
  traits.appendChild(node("h2", null, "性格倾向（Layer 2 · 0–1 的数值，越高越明显）"));
  const rows = node("div");
  rows.id = "pe-traits";
  traits.appendChild(rows);
  const addTrait = node("button", null, "+ 添加一条");
  addTrait.type = "button";
  addTrait.addEventListener("click", () => { addTraitRow("", 0.5); markPersonaDirty(); });
  traits.appendChild(addTrait);
  box.appendChild(traits);

  const style = node("section", "cfg-group");
  style.appendChild(node("h2", null, "说话风格（Layer 3）"));
  style.appendChild(peField("pe-language", "language（例如 zh-CN）"));
  style.appendChild(peField("pe-sentence", "sentence_length"));
  style.appendChild(peField("pe-emoji", "emoji_frequency"));
  style.appendChild(peField("pe-rhetorical", "rhetorical_questions"));
  style.appendChild(peField("pe-interaction", "preferred_interaction"));
  box.appendChild(style);

  const behavior = node("section", "cfg-group");
  behavior.appendChild(node("h2", null, "行为规则（behavior.rules · 一行一条）"));
  behavior.appendChild(peTextarea("pe-rules", "她该怎么做、不该怎么做"));
  box.appendChild(behavior);

  const prompt = node("section", "cfg-group");
  prompt.appendChild(node("h2", null, "硬约束（prompt.hard_constraints · 一行一条）"));
  prompt.appendChild(peTextarea("pe-constraints", "追加到 Layer 0 的角色特有约束"));
  box.appendChild(prompt);

  const errors = node("section", "cfg-group");
  errors.appendChild(node("h2", null, "降级话术（errors）"));
  errors.appendChild(peField("pe-llm-unavailable", "llm_unavailable（模型连不上时说什么；留空 = 用内置文案）"));
  box.appendChild(errors);

  box.appendChild(node("p", "cfg-hint",
    "保存会重写整份 TOML（原注释不保留，旧文件留成 <id>.toml.bak）。"
    + "保存与切换都要重启后端才生效——人格是在启动时装配的。"));
}

function fillPersonaEditor(document) {
  const identity = document.identity || {};
  el("pe-name").value = identity.name || "";
  el("pe-display").value = identity.display_name || "";
  el("pe-pronouns").value = identity.pronouns || "";
  el("pe-version").value = identity.version || "1";
  el("pe-self").value = identity.self_description || "";
  el("pe-backstory").value = identity.backstory || "";

  el("pe-traits").replaceChildren();
  const traits = document.traits || {};
  for (const name of Object.keys(traits)) addTraitRow(name, traits[name]);

  const communication = document.communication || {};
  el("pe-language").value = communication.language || "zh-CN";
  el("pe-sentence").value = communication.sentence_length || "";
  el("pe-emoji").value = communication.emoji_frequency || "";
  el("pe-rhetorical").value = communication.rhetorical_questions || "";
  el("pe-interaction").value = communication.preferred_interaction || "";

  el("pe-rules").value = ((document.behavior || {}).rules || []).join("\n");
  el("pe-constraints").value = ((document.prompt || {}).hard_constraints || []).join("\n");
  el("pe-llm-unavailable").value = ((document.errors || {}).llm_unavailable) || "";
}

function readPersonaEditor() {
  const traits = {};
  for (const row of el("pe-traits").querySelectorAll(".pe-trait")) {
    const name = row.querySelector(".pe-trait-key").value.trim();
    if (!name) continue;
    const raw = row.querySelector(".pe-trait-value").value.trim();
    const value = Number(raw);
    if (!Number.isFinite(value) || value < 0 || value > 1) {
      throw new Error("trait「" + name + "」的值要在 0 与 1 之间（现在是 " + (raw || "空") + "）。");
    }
    traits[name] = value;
  }

  const lines = (controlId) => el(controlId).value.split("\n")
    .map((line) => line.trim()).filter((line) => line.length > 0);
  const backstory = el("pe-backstory").value.trim();

  return {
    identity: {
      name: el("pe-name").value.trim(),
      display_name: el("pe-display").value.trim(),
      pronouns: el("pe-pronouns").value.trim(),
      version: el("pe-version").value.trim() || "1",
      self_description: el("pe-self").value.trim(),
      backstory: backstory ? backstory : null,
    },
    traits: traits,
    communication: {
      language: el("pe-language").value.trim() || "zh-CN",
      sentence_length: el("pe-sentence").value.trim(),
      emoji_frequency: el("pe-emoji").value.trim(),
      rhetorical_questions: el("pe-rhetorical").value.trim(),
      preferred_interaction: el("pe-interaction").value.trim(),
    },
    behavior: { rules: lines("pe-rules") },
    prompt: { hard_constraints: lines("pe-constraints") },
    errors: { llm_unavailable: el("pe-llm-unavailable").value.trim() || null },
  };
}

function renderPersonaList() {
  const box = el("persona-list");
  box.replaceChildren();

  if (app.personas.list.length === 0) {
    box.appendChild(node("p", "notice", "人格目录里还没有 .toml 文件。"));
  }

  for (const item of app.personas.list) {
    const button = node("button", "persona-item"
      + (item.id === app.personas.selected ? " active" : ""));
    button.type = "button";
    button.appendChild(node("div", "name", item.display_name || item.id));
    button.appendChild(node("div", "meta", item.id));
    const badges = node("div", "badges");
    if (item.is_running) badges.appendChild(node("span", "badge", "使用中"));
    if (item.is_pending) badges.appendChild(node("span", "badge warn", "重启后启用"));
    if (item.error) badges.appendChild(node("span", "badge warn", "文件坏了"));
    button.appendChild(badges);
    button.addEventListener("click", () => {
      selectPersona(item.id).catch(reportPersonaError);
    });
    box.appendChild(button);
  }

  syncPersonaButtons();
}

function syncPersonaButtons() {
  const entry = personaEntry(app.personas.selected);
  const broken = Boolean(entry && entry.error);
  el("persona-save").disabled = !entry || broken;
  el("persona-activate").disabled = !entry || broken || entry.is_running;
  el("persona-activate").title = entry && entry.is_running ? "已经是这一位在说话了" : "";
  el("persona-delete").disabled = !entry;
}

async function loadPersonas() {
  const page = await fetchJson("/v1/admin/personas", null, 15000);
  app.personas.list = page.personas || [];
  app.personas.directory = page.directory || "";
  app.personas.runningId = page.running_id || null;
  app.personas.pendingId = page.pending_id || null;
  app.personas.supervised = Boolean(page.supervised);

  el("persona-sub").textContent = "目录 " + app.personas.directory
    + (app.personas.runningId ? " · 运行中：" + app.personas.runningId : "")
    + (app.personas.pendingId && app.personas.pendingId !== app.personas.runningId
      ? " · 重启后切换为：" + app.personas.pendingId : "");

  renderPersonaList();

  const ids = app.personas.list.map((item) => item.id);
  if (ids.indexOf(app.personas.selected) < 0) {
    app.personas.selected = ids.indexOf(app.personas.runningId) >= 0
      ? app.personas.runningId : (ids[0] || null);
  }
  if (app.personas.selected) {
    await selectPersona(app.personas.selected);
  } else {
    app.personas.document = null;
    buildPersonaEditor();
  }
}

async function selectPersona(personaId) {
  if (app.personas.selected && personaId !== app.personas.selected && app.personas.dirty) {
    const leave = window.confirm("切换过去会丢掉当前没保存的修改。继续？");
    if (!leave) return;
  }
  clearPersonaBanner();
  app.personas.selected = personaId;
  renderPersonaList();

  const entry = personaEntry(personaId);
  if (entry && entry.error) {
    // 坏文件：如实说清坏在哪，编辑器留空——不让它看起来"可编辑"
    personaNote("danger", "这一位的文件读不出来：" + entry.error);
    app.personas.document = null;
    buildPersonaEditor();
    return;
  }

  const body = await fetchJson("/v1/admin/personas/" + encodeURIComponent(personaId), null, 15000);
  app.personas.document = body.document;
  fillPersonaEditor(body.document);
  app.personas.dirty = false;
}

function newPersonaTemplate(displayName) {
  return {
    identity: {
      name: displayName,
      display_name: displayName,
      pronouns: "她",
      version: "1",
      self_description: "（这个角色是谁：一段自我介绍，会进她的 prompt）",
      backstory: null,
    },
    traits: {},
    communication: {
      language: "zh-CN",
      sentence_length: "short_to_medium",
      emoji_frequency: "low",
      rhetorical_questions: "occasional",
      preferred_interaction: "conversational",
    },
    behavior: { rules: [] },
    prompt: { hard_constraints: [] },
    errors: { llm_unavailable: null },
  };
}

async function createPersona() {
  const personaId = el("persona-new-id").value.trim();
  const displayName = el("persona-new-name").value.trim() || personaId;
  if (!personaId) {
    el("persona-new-error").textContent = "先给一个 id。";
    return;
  }

  const body = await fetchJson("/v1/admin/personas", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: personaId, persona: newPersonaTemplate(displayName) }),
  }, 20000);

  el("persona-new-dialog").close();
  app.personas.selected = body.id;
  app.personas.dirty = false;
  await loadPersonas();
  personaNote("ok", "已创建 " + body.path + "。改好点「保存」，再点「切换为这一位」。");
}

async function savePersona() {
  const personaId = app.personas.selected;
  if (!personaId) return;

  let document;
  try {
    document = readPersonaEditor();
  } catch (error) {
    personaNote("danger", String((error && error.message) || error));
    return;
  }

  const body = await fetchJson("/v1/admin/personas/" + encodeURIComponent(personaId), {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ persona: document }),
  }, 20000);

  app.personas.document = body.document;
  app.personas.dirty = false;
  await loadPersonas();
  personaNote("ok", "已保存 " + body.path + "（旧文件留成 .bak）。重启后生效。");
}

async function activatePersona() {
  const personaId = app.personas.selected;
  if (!personaId) return;
  const previousRunning = app.personas.runningId;

  const result = await fetchJson(
    "/v1/admin/personas/" + encodeURIComponent(personaId) + "/activate",
    { method: "POST" }, 20000,
  );

  if (!result.supervised) {
    await loadPersonas();
    personaNote("warn", "已把 " + personaId + " 写进 " + result.env_file
      + "。这个后端不是监督模式——手动重启（`uv run astra serve`）之后才生效。");
    return;
  }

  await loadPersonas();
  const confirmed = window.confirm("已把「" + personaId + "」设为下次启动的人格。\n\n"
    + "现在重启后端吗？（在跑的这一轮会中断）");
  if (!confirmed) {
    personaNote("warn", "已写入 .env，还没有重启——重启之后才生效。");
    return;
  }

  await restartBackend();
  await loadPersonas();

  if (app.personas.runningId && app.personas.runningId !== previousRunning) {
    // 真的换了一位：当前那段会话属于旧角色，本地引用要清掉（历史与记忆都换了一套）
    app.conversationId = null;
    app.conversationStatus = null;
    writeStored(STORE_KEY, "");
    app.unclaimed.length = 0;
    app.turnBubbles.clear();
    el("chat").replaceChildren();
    el("conversation-label").textContent = "已切换到 " + app.personas.runningId;
    createBubble("system", "现在是「" + app.personas.runningId
      + "」在说话。左边那一栏是这一位的会话，记忆页也是她的记忆。");
    loadConversations().catch(() => {});
    loadMemories().catch(() => {});
    loadState().catch(() => {});
  }
  personaNote("ok", "运行中：" + (app.personas.runningId || "—"));
}

async function deletePersona() {
  const personaId = app.personas.selected;
  const entry = personaEntry(personaId);
  if (!entry) return;

  const confirmed = window.confirm(
    "删除人格「" + (entry.display_name || personaId) + "」？\n\n"
    + "只删 " + entry.path + " 这个文件。\n"
    + "这一位的对话历史、记忆与情绪状态都还在数据库里——用同名 id 建回来就能接着用。"
  );
  if (!confirmed) return;

  await fetchJson("/v1/admin/personas/" + encodeURIComponent(personaId),
    { method: "DELETE" }, 15000);

  app.personas.selected = null;
  app.personas.dirty = false;
  await loadPersonas();
  personaNote("ok", "已删除 " + personaId + ".toml（它的对话与记忆仍在数据库里）。");
}

/* ── 动画页的事件绑定 ─────────────────────────────────── */

el("anime-reload").addEventListener("click", () => { loadAnime().catch(reportAnimeError); });

el("anime-save").addEventListener("click", () => { saveAnime().catch(reportAnimeError); });

el("anime-export").addEventListener("click", () => {
  downloadJson("astra_animation.json", animeText());
});

el("anime-paste").addEventListener("click", () => {
  el("anime-paste-text").value = "";
  el("anime-paste-error").textContent = "";
  el("anime-paste-dialog").showModal();
});

el("anime-paste-cancel").addEventListener("click", () => el("anime-paste-dialog").close());

el("anime-paste-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = el("anime-paste-text").value.trim();
  if (!text) {
    el("anime-paste-error").textContent = "先贴一份 JSON 进来。";
    return;
  }
  try {
    app.anime.raw = normalizeAnime(JSON.parse(text));
  } catch (error) {
    el("anime-paste-error").textContent = "解析失败：" + error.message;
    return;
  }
  el("anime-paste-dialog").close();
  renderAnime();
  createBubble("system", "已把粘贴的映射载入动画页——确认无误后点「保存到后端」。");
});

/* ── 人格页的事件绑定 ─────────────────────────────────── */

el("persona-reload").addEventListener("click", () => { loadPersonas().catch(reportPersonaError); });

el("persona-save").addEventListener("click", () => { savePersona().catch(reportPersonaError); });

el("persona-activate").addEventListener("click", () => { activatePersona().catch(reportPersonaError); });

el("persona-delete").addEventListener("click", () => { deletePersona().catch(reportPersonaError); });

el("persona-new").addEventListener("click", () => {
  el("persona-new-id").value = "";
  el("persona-new-name").value = "";
  el("persona-new-error").textContent = "";
  el("persona-new-dialog").showModal();
});

el("persona-new-cancel").addEventListener("click", () => el("persona-new-dialog").close());

el("persona-new-form").addEventListener("submit", (event) => {
  event.preventDefault();
  createPersona().catch((error) => {
    el("persona-new-error").textContent = "创建失败：" + error.message;
  });
});

/* ── 启动 ─────────────────────────────────────────────── */

app.sessionId = newUlid();
el("session-id").textContent = "session " + app.sessionId.slice(0, 8);
app.voice.preview = readStored(PREVIEW_KEY) !== "0";   // 默认开
el("voice-preview").checked = app.voice.preview;
renderAvatarTags();
syncVoiceAvailability();
buildPersonaEditor();   // 编辑器先建好，打开人格页时只填值
connect();
refreshHealth();
loadState();
restoreConversation();
loadConversations().catch(() => {});
</script>
</body>
</html>
