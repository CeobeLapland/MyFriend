<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra · Studio</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1014;
    --surface: #14171e;
    --surface-2: #1b1f28;
    --surface-3: #232838;
    --border: #262c38;
    --text: #e9ecf1;
    --muted: #8a93a3;
    --accent: #5cf5a8;
    --accent-soft: rgba(92, 245, 168, .12);
    --user: #7aa8ff;
    --user-soft: rgba(122, 168, 255, .13);
    --warn: #efaa17;
    --danger: #e8574a;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p { margin: 0; }
  button {
    font: inherit; cursor: pointer; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 7px 14px;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  button:hover { background: var(--surface-3); border-color: #333b4b; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1013; font-weight: 600; }
  button.primary:hover { background: #76f8bb; }
  button.danger { color: #ff9e94; border-color: rgba(232, 87, 74, .45); }
  button.danger:hover { background: rgba(232, 87, 74, .14); border-color: var(--danger); }
  input, textarea, select {
    font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  ::placeholder { color: #616a7c; }

  .app { display: grid; grid-template-columns: 206px minmax(0, 1fr) 320px; height: 100vh; }

  /* ── 左栏 ───────────────────────────────── */
  .nav { display: flex; flex-direction: column; gap: 24px; padding: 20px 14px;
         background: var(--surface); border-right: 1px solid var(--border);
         overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; font-size: 16px; font-weight: 600; }
  .logo { width: 9px; height: 9px; border-radius: 50%; background: var(--accent);
          box-shadow: 0 0 14px rgba(92, 245, 168, .75); }
  .menu { display: flex; flex-direction: column; gap: 3px; }
  .menu-item { text-align: left; background: transparent; border-color: transparent;
               color: var(--muted); padding: 9px 12px; }
  .menu-item:hover { background: var(--surface-2); color: var(--text); }
  .menu-item.active { background: var(--surface-2); border-color: var(--border);
                      color: var(--text); font-weight: 600; }
  .nav-foot { margin-top: auto; display: flex; flex-direction: column; gap: 7px;
              padding: 0 8px; font-size: 11px; color: var(--muted); }
  .conn { display: flex; align-items: center; gap: 7px; }
  .nav-foot .sid { font-family: var(--mono); opacity: .65; word-break: break-all; }

  /* ── 中栏 ───────────────────────────────── */
  /* min-height: 0 是**必须的**：grid 子项的 min-height 默认是 auto（= 内容高度），
     内容比视口高时它会把隐式行一起撑大、整个 grid 溢出 100vh，再被 body 的
     overflow:hidden 裁掉——里面那些 overflow-y:auto 的滚动容器于是全部失效
     （设置页/模型页/事件页/记忆页/长历史的对话区都踩这一条）。 */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .page { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .page[hidden] { display: none; }
  .page-head { display: flex; align-items: flex-start; gap: 16px;
               padding: 18px 28px 14px; border-bottom: 1px solid var(--border); }
  .page-head h1 { font-size: 17px; font-weight: 600; }
  .page-head .sub { margin-top: 2px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .head-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .switch { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .switch input { accent-color: var(--accent); width: 15px; height: 15px; }

  /* ── 对话 ───────────────────────────────── */
  .chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
          padding: 22px 28px 10px; min-height: 0; }
  .msg { display: flex; flex-direction: column; gap: 5px; max-width: min(680px, 88%); }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant, .msg.failed { align-self: flex-start; }
  .msg .who { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  .msg .bubble { padding: 11px 15px; border-radius: 16px; background: var(--surface-2);
                 border: 1px solid var(--border); white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: var(--user-soft); border-color: rgba(122, 168, 255, .26);
                      border-bottom-right-radius: 6px; }
  .msg.assistant .bubble { border-bottom-left-radius: 6px; }
  .msg.failed .bubble { border-color: rgba(232, 87, 74, .45); color: #ffc0b8; }
  .msg .bubble.pending { color: var(--muted); }
  .msg.interrupted .bubble { opacity: .72; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .msg.user .tags { justify-content: flex-end; }
  .tag { font-size: 11px; color: var(--muted); background: var(--surface-2);
         border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; font-family: var(--mono); }
  .tag.accent { color: var(--accent); border-color: rgba(92, 245, 168, .32); }
  .tag.warn { color: var(--warn); border-color: rgba(239, 170, 23, .38); }
  .notice { align-self: center; max-width: 88%; text-align: center; font-size: 12px; color: var(--muted); }
  .composer { display: flex; gap: 10px; padding: 12px 28px 20px; }
  .composer input { flex: 1; border-radius: 12px; padding: 11px 14px; }

  /* ── 对话区 / 会话栏 ────────────────────── */
  .chat-split { flex: 1; display: flex; min-height: 0; }
  .conv-pane { flex: none; width: 216px; display: flex; flex-direction: column; min-height: 0;
               background: var(--surface); border-right: 1px solid var(--border); }
  .conv-pane-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
                    font-size: 11px; color: var(--muted); letter-spacing: .06em;
                    text-transform: uppercase; border-bottom: 1px solid var(--border); }
  .conv-pane-head button { margin-left: auto; padding: 2px 9px; font-size: 11px; }
  .conv-list { flex: 1; overflow-y: auto; min-height: 0; padding: 8px;
               display: flex; flex-direction: column; gap: 6px; }
  .conv-row { position: relative; display: flex; }
  .conv-item { flex: 1; text-align: left; padding: 8px 34px 8px 10px; border-radius: 10px; cursor: pointer;
               background: transparent; border: 1px solid transparent; color: var(--muted); }
  .conv-item:hover { background: var(--surface-2); color: var(--text); }
  .conv-item.active { background: var(--surface-2); border-color: var(--accent); color: var(--text); }
  .conv-item .when { font-family: var(--mono); font-size: 10px; opacity: .8; }
  .conv-item .what { margin-top: 3px; font-size: 12px; word-break: break-word; }
  /* 删除按钮：常态可见（免得找不到），悬停才变色 */
  .conv-del { position: absolute; top: 6px; right: 6px; padding: 1px 7px; font-size: 11px;
              color: var(--muted); background: var(--surface-2); border-color: transparent;
              opacity: .55; }
  .conv-del:hover:enabled { color: #ff9e94; border-color: rgba(232, 87, 74, .45); opacity: 1; }
  .conv-del:disabled { opacity: .2; cursor: default; }
  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* ── 语音 ───────────────────────────────── */
  .voice-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
               padding: 0 28px 18px; font-size: 12px; color: var(--muted); }
  .talk { user-select: none; touch-action: none; padding: 7px 18px; }
  .talk.active { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
  .voice-status { font-family: var(--mono); font-size: 11px; }
  .voice-status.warn { color: var(--warn); }

  /* ── 记忆 ───────────────────────────────── */
  .memory-toolbar { display: flex; gap: 10px; padding: 16px 28px 10px; }
  .memory-toolbar input[type=search] { flex: 1; }
  .memory-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
                 padding: 8px 28px 24px; min-height: 0; }
  .mem { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .mem .top { display: flex; align-items: center; gap: 10px; }
  .mem .type { font-size: 11px; color: var(--accent); background: var(--accent-soft);
               border-radius: 999px; padding: 1px 9px; }
  .mem .metrics { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .mem .text { margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .mem .foot { margin-top: 10px; display: flex; align-items: center; gap: 12px;
               font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .mem .actions { margin-left: auto; display: flex; gap: 6px; }
  .mem .actions button { padding: 3px 11px; font-size: 12px; }

  /* ── 设置页 ─────────────────────────────── */
  .config-body { flex: 1; overflow-y: auto; padding: 4px 28px 28px; min-height: 0; }
  .cfg-group { margin-top: 20px; }
  .cfg-group h2 { font-size: 12px; color: var(--muted); letter-spacing: .08em;
                  text-transform: uppercase; margin-bottom: 8px; }
  .cfg-row { display: flex; flex-direction: column; gap: 5px; padding: 9px 0;
             border-bottom: 1px solid var(--border); }
  .cfg-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .cfg-label { font-size: 13px; }
  .cfg-key { font-family: var(--mono); font-size: 11px; color: var(--muted); opacity: .7; }
  .cfg-line { display: flex; align-items: center; gap: 10px; }
  .cfg-line select, .cfg-line input[type=text], .cfg-line input[type=number] { flex: 1; max-width: 420px; }
  .cfg-line input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
  .cfg-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; color: var(--muted); background: var(--surface-2);
           border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; white-space: nowrap; }
  .badge.warn { color: var(--warn); border-color: rgba(239, 170, 23, .38); }
  .cfg-hint { font-size: 11px; color: var(--muted); }
  .banner { display: flex; flex-direction: column; gap: 6px; padding: 12px 28px 0; }
  .banner[hidden] { display: none; }
  .note { font-size: 12px; padding: 8px 12px; border-radius: 10px; color: var(--muted);
          background: var(--surface-2); border: 1px solid var(--border); }
  .note.warn { color: var(--warn); border-color: rgba(239, 170, 23, .35); }
  .note.danger { color: #ff9e94; border-color: rgba(232, 87, 74, .45); }
  .note.ok { color: var(--accent); border-color: rgba(92, 245, 168, .35); }
  .veil { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
          justify-content: center; background: rgba(8, 10, 13, .72); }
  .veil[hidden] { display: none; }
  .veil-card { display: flex; align-items: center; gap: 10px; padding: 16px 22px;
               background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }

  /* ── 事件页 ─────────────────────────────── */
  .evt { display: flex; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--border);
         font-family: var(--mono); font-size: 11px; }
  .evt .evt-time { color: var(--muted); flex: none; }
  .evt .evt-type { color: var(--accent); flex: none; min-width: 210px; }
  .evt .evt-payload { color: var(--muted); word-break: break-all; }

  /* ── 动画页 ─────────────────────────────── */
  .anime-card { background: var(--surface); border: 1px solid var(--border);
                border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .anime-card .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .anime-card .top .name { font-size: 13px; }
  .anime-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .anime-clip { display: grid; grid-template-columns: minmax(0, 1fr) 84px 74px 40px;
                gap: 8px; align-items: center; }
  .anime-clip .loop { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .anime-clip input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--accent); }
  .anime-clip button { padding: 3px 8px; font-size: 12px; }
  .anime-slot { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px;
                align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }

  /* ── 人格页 ─────────────────────────────── */
  .persona-split { flex: 1; display: flex; min-height: 0; }
  .persona-pane { flex: none; width: 240px; display: flex; flex-direction: column; min-height: 0;
                  background: var(--surface); border-right: 1px solid var(--border); }
  .persona-pane-head { padding: 10px 12px; font-size: 11px; color: var(--muted);
                       letter-spacing: .06em; text-transform: uppercase;
                       border-bottom: 1px solid var(--border); }
  .persona-list { flex: 1; overflow-y: auto; min-height: 0; padding: 8px;
                  display: flex; flex-direction: column; gap: 6px; }
  .persona-item { text-align: left; padding: 8px 10px; border-radius: 10px; cursor: pointer;
                  background: transparent; border: 1px solid transparent; color: var(--muted); }
  .persona-item:hover { background: var(--surface-2); color: var(--text); }
  .persona-item.active { background: var(--surface-2); border-color: var(--accent); color: var(--text); }
  .persona-item .name { font-size: 13px; }
  .persona-item .meta { margin-top: 2px; font-family: var(--mono); font-size: 10px; opacity: .8; }
  .persona-item .badges { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
  .persona-pane-actions { display: flex; gap: 8px; padding: 10px 12px;
                          border-top: 1px solid var(--border); }
  .persona-pane-actions button { flex: 1; padding: 5px 8px; font-size: 12px; }
  .persona-editor { flex: 1; overflow-y: auto; min-height: 0; min-width: 0; padding: 4px 28px 28px; }
  .persona-editor textarea { min-height: 96px; resize: vertical; font: inherit; }
  .pe-trait { display: grid; grid-template-columns: minmax(0, 1fr) 90px 40px; gap: 8px;
              align-items: center; margin-bottom: 6px; }
  .pe-trait button { padding: 3px 8px; font-size: 12px; }

  /* ── 右栏 ───────────────────────────────── */
  .rail { display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
          padding: 18px 18px 24px; background: var(--surface); border-left: 1px solid var(--border); }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 15px; }
  .card h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em;
             text-transform: uppercase; margin-bottom: 12px; }
  .chips { display: flex; flex-direction: column; gap: 9px; }
  .chip { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .chip .name { min-width: 76px; color: var(--muted); }
  .chip .value { font-family: var(--mono); font-size: 11px; }
  .why { margin: -3px 0 0 16px; font-size: 11px; color: var(--muted); word-break: break-word; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4a5162; flex: none; }
  .dot.ok { background: var(--accent); box-shadow: 0 0 8px rgba(92, 245, 168, .5); }
  .dot.degraded { background: var(--warn); }
  .dot.down { background: var(--danger); }
  .dot.not_configured { background: #4a5162; }
  .dot.connecting { background: var(--warn); }
  .card-foot { margin-top: 12px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .state-group { margin-bottom: 14px; }
  .state-heading { font-size: 11px; color: var(--muted); letter-spacing: .06em;
                   text-transform: uppercase; margin-bottom: 7px; }
  .bar-row { display: grid; grid-template-columns: 62px 1fr 34px; align-items: center;
             gap: 8px; margin-bottom: 5px; font-size: 11px; }
  .bar-row .k { color: var(--muted); }
  .bar { height: 5px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 999px;
               transition: width .4s ease; }
  .bar-row .v { text-align: right; font-family: var(--mono); }
  .rail .tags { margin-top: 12px; }

  /* ── 编辑弹窗 ───────────────────────────── */
  dialog { background: var(--surface); color: var(--text); border: 1px solid var(--border);
           border-radius: 16px; padding: 0; width: min(460px, 92vw); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  .dialog-body { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px 16px; }
  .dialog-body h3 { font-size: 15px; }
  .dialog-body label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
  .dialog-body textarea { resize: vertical; min-height: 96px; }
  .dialog-row { display: flex; gap: 12px; }
  .dialog-row label { flex: 1; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; }
  .dialog-error { font-size: 12px; color: #ff9e94; min-height: 0; }

  @media (max-width: 1080px) {
    .app { grid-template-columns: 176px minmax(0, 1fr) 272px; }
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 176px minmax(0, 1fr); }
    .rail { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="nav">
    <div class="brand"><span class="logo"></span><span>Astra</span></div>
    <nav class="menu">
      <button type="button" class="menu-item active" data-page="chat">对话</button>
      <button type="button" class="menu-item" data-page="memory">记忆</button>
      <button type="button" class="menu-item" data-page="persona">人格</button>
      <button type="button" class="menu-item" data-page="config">设置</button>
      <button type="button" class="menu-item" data-page="models">模型</button>
      <button type="button" class="menu-item" data-page="events">事件</button>
      <button type="button" class="menu-item" data-page="anime">动画</button>
    </nav>
    <div class="nav-foot">
      <div class="conn"><span class="dot" id="ws-dot"></span><span id="ws-state">连接中…</span></div>
      <div class="sid" id="session-id">—</div>
    </div>
  </aside>

  <main class="main">
    <section class="page" id="page-chat">
      <header class="page-head">
        <div>
          <h1>对话</h1>
          <p class="sub" id="conversation-label">尚未开始会话</p>
        </div>
        <div class="head-actions">
          <button type="button" id="load-history">载入历史</button>
          <button type="button" class="primary" id="new-conversation">新会话</button>
        </div>
      </header>
      <div class="chat-split">
        <aside class="conv-pane">
          <div class="conv-pane-head">
            <span>过往会话</span>
            <button type="button" id="conv-refresh">刷新</button>
          </div>
          <div class="conv-list" id="conv-list"></div>
        </aside>
        <div class="chat-main">
          <div class="chat" id="chat"></div>
          <form class="composer" id="composer">
            <input type="text" id="text" placeholder="说点什么…（回车发送；上一轮还在跑时再发一条就会打断它）" autocomplete="off">
            <button type="submit" class="primary" id="send">发送</button>
          </form>
          <div class="voice-row">
            <label class="switch"><input type="checkbox" id="voice-mode"><span>语音模式（回复合成语音）</span></label>
            <label class="switch"><input type="checkbox" id="voice-preview" checked><span>识别后先填进输入框</span></label>
            <button type="button" class="talk" id="talk" disabled>按住说话</button>
            <span class="voice-status" id="voice-status">—</span>
          </div>
        </div>
      </div>
    </section>

    <section class="page" id="page-memory" hidden>
      <header class="page-head">
        <div>
          <h1>记忆</h1>
          <p class="sub" id="memory-summary">—</p>
        </div>
        <div class="head-actions">
          <label class="switch"><input type="checkbox" id="memory-enabled"><span>启用记忆</span></label>
          <button type="button" id="memory-export">导出</button>
          <button type="button" class="danger" id="memory-clear">清空全部</button>
        </div>
      </header>
      <form class="memory-toolbar" id="memory-search-form">
        <input type="search" id="memory-search" placeholder="语义检索：输入一句话，按相关度找回记忆" autocomplete="off">
        <button type="submit">搜索</button>
        <button type="button" id="memory-search-reset">清除</button>
        <button type="button" id="memory-refresh">刷新</button>
      </form>
      <div class="memory-list" id="memory-list"></div>
    </section>

    <section class="page" id="page-persona" hidden>
      <header class="page-head">
        <div>
          <h1>人格</h1>
          <p class="sub" id="persona-sub">—</p>
        </div>
        <div class="head-actions">
          <button type="button" id="persona-reload">重新载入</button>

<script>
"use strict";

/* ── 常量 ─────────────────────────────────────────────── */

const CANONICAL = ["api", "database", "llm", "stt", "tts"];

const EMOTION_DIMS = ["happiness", "energy", "curiosity", "social_need",
                      "stress", "embarrassment", "excitement"];
const RELATIONSHIP_DIMS = ["familiarity", "trust", "affection", "reliance", "conflict"];

const DIM_ZH = {
  happiness: "愉悦", energy: "活力", curiosity: "好奇", social_need: "社交",
  stress: "压力", embarrassment: "羞怯", excitement: "兴奋",
  familiarity: "熟悉", trust: "信任", affection: "好感", reliance: "依赖", conflict: "摩擦",
};

const MEMORY_TYPE_ZH = { semantic: "语义", episodic: "情景", preference: "偏好",
                         relationship: "关系", event: "事件" };

//: /health 在下游全挂时单次要 ~6s（三个探针各 ~2s、串行）——轮询间隔必须比它宽，
//: 否则请求会堆积。串行排期：上一次返回（或超时）后才排下一次。
const HEALTH_INTERVAL_MS = 10000;
const HEALTH_TIMEOUT_MS = 8000;
const WS_RECONNECT_MAX_MS = 10000;
const HISTORY_LIMIT = 200;
const STORE_KEY = "astra.studio.conversation_id";
//: 语音"识别后先填进输入框"的偏好（默认开）
const PREVIEW_KEY = "astra.studio.voice_preview";

/* ── 小工具 ───────────────────────────────────────────── */

const el = (id) => document.getElementById(id);

const app = {
  sessionId: null,
  conversationId: null,
  conversationStatus: null,
  conversations: [],
  socket: null,
  connectedOnce: false,
  reconnectDelayMs: 1000,
  reconnectTimer: null,
  healthTimer: null,
  //: 已发出、还没被 turn.started 认领的占位气泡（FIFO——服务端保证顺序）
  unclaimed: [],
  //: turn_id -> 气泡节点，turn.completed / failed 之后清理
  turnBubbles: new Map(),
  health: null,
  healthAt: 0,
  memories: [],
  memoryTotal: 0,
  memoryQuery: "",
  editingId: null,
  avatar: { expression: null, action: null },
  adminConfig: null,
  restarting: false,
  lmstudio: null,
  events: [],
  anime: { actions: [], raw: null },
  //: 人格页（ADR 0029）：列表 + 运行中 / 待启用 + 当前选中的那份文档
  personas: {
    list: [], directory: "", runningId: null, pendingId: null, supervised: false,
    selected: null, document: null, dirty: false,
  },
  voice: {
    // 采集
    mic: null,
    stream: null,
    processor: null,
    // 播放
    playback: null,
    playbackRate: 0,
    nextPlayTime: 0,
    sources: new Set(),
    expectedChunks: 0,
    chunks: 0,
    // 来自 /health 的两个组件状态
    stt: "unknown",
    tts: "unknown",
    state: "idle",
    //: 识别后先填进输入框（默认开；本地 STT 错字多，ADR 0028）
    preview: true,
    //: 正在启动采集 / 启动期间用户已经松手（见 beginTalk 的竞态）
    starting: false,
    released: false,
  },
};

function node(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;   // 一律 textContent，绝不当 HTML 解析
  return element;
}

function newUlid() {
  const alphabet = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(bytes, (byte) => alphabet[byte % alphabet.length]).join("");
}

function readStored(key) {
  try { return window.localStorage.getItem(key); } catch { return null; }
}

function writeStored(key, value) {
  try {
    if (value) window.localStorage.setItem(key, value);
    else window.localStorage.removeItem(key);
  } catch { /* 隐私模式下写入会失败——只是记不住会话，不影响使用 */ }
}

async function fetchJson(url, options, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || HEALTH_TIMEOUT_MS);
  const init = Object.assign({}, options || {}, { signal: controller.signal });
  try {
    const response = await fetch(url, init);
    if (!response.ok) throw new Error("HTTP " + response.status + await errorDetail(response));
    if (response.status === 204) return null;
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

//: 管理端点会用 body 里的 detail.message 说清"为什么不行"（例如哪一项非法）——要透给用户
async function errorDetail(response) {
  try {
    const body = await response.json();
    const detail = body && body.detail ? body.detail : null;
    if (!detail) return "";
    return "：" + (detail.message || detail.code || "");
  } catch {
    return "";
  }
}

/* ── 左栏：页签与连接状态 ─────────────────────────────── */

function showPage(name) {
  for (const item of document.querySelectorAll(".menu-item")) {
    item.classList.toggle("active", item.dataset.page === name);
  }
  el("page-chat").hidden = name !== "chat";
  el("page-memory").hidden = name !== "memory";
  el("page-config").hidden = name !== "config";
  el("page-models").hidden = name !== "models";
  el("page-events").hidden = name !== "events";
  el("page-anime").hidden = name !== "anime";
  el("page-persona").hidden = name !== "persona";
  if (name === "memory") loadMemories().catch(() => {});
  if (name === "config") loadAdminConfig().catch(reportConfigError);
  if (name === "models") loadLmStudio().catch(reportModelsError);
  if (name === "events") renderEvents();
  if (name === "anime") loadAnime().catch(reportAnimeError);
  if (name === "persona") loadPersonas().catch(reportPersonaError);
}

function setConnection(kind, text) {
  el("ws-dot").className = "dot " + kind;
  el("ws-state").textContent = text;
}

/* ── 右栏：组件状态（health） ─────────────────────────── */

function renderHealth(health, staleForMs) {
  const box = el("health-chips");
  box.replaceChildren();

  const overall = node("div", "chip");
  overall.append(node("span", "dot " + health.status), node("span", "name", "overall"),
                 node("span", "value", health.status));
  box.appendChild(overall);

  for (const name of CANONICAL) {
    const component = health.components[name];
    if (!component) continue;
    const chip = node("div", "chip");
    chip.appendChild(node("span", "dot " + component.status));
    chip.appendChild(node("span", "name", name));
    let value = component.status;
    if (component.latency_ms !== null && component.latency_ms !== undefined) {
      value += " · " + Math.round(component.latency_ms) + "ms";
    }
    chip.appendChild(node("span", "value", value));
    box.appendChild(chip);

    // detail.error 是探针给出的原因（例如 backend unreachable）——如实显示
    const detail = component.detail && component.detail.error ? String(component.detail.error) : "";
    if (detail) box.appendChild(node("p", "why", detail));
  }

  if (staleForMs === null) {
    el("health-foot").textContent = "更新于 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } else {
    el("health-foot").textContent =
      "显示的是 " + Math.round(staleForMs / 1000) + " 秒前的探测结果（最近一次没探到）";
  }

  // 语音按钮的可用性只信 /health（ADR 0027 §1：不假装能用）
  app.voice.stt = (health.components.stt || {}).status || "unknown";
  app.voice.tts = (health.components.tts || {}).status || "unknown";
  syncVoiceAvailability();
}

async function refreshHealth() {
  try {
    const health = await fetchJson("/health", null, HEALTH_TIMEOUT_MS);
    app.health = health;
    app.healthAt = Date.now();
    renderHealth(health, null);
  } catch (error) {
    // 探测失败**不清空**面板：下游全挂时 /health 本身就要 ~6s，
    // 瞬时的探不到不等于"组件挂了"——保留上次的值并标注陈旧
    if (app.health) {
      renderHealth(app.health, Date.now() - app.healthAt);
    } else {
      el("health-chips").replaceChildren(node("p", "why", "暂时探测不到后端：" + error.message));
      el("health-foot").textContent = "等待后端…";
    }
  } finally {
    clearTimeout(app.healthTimer);
    app.healthTimer = setTimeout(() => { refreshHealth().catch(() => {}); }, HEALTH_INTERVAL_MS);
  }
}

/* ── 右栏：角色状态 ───────────────────────────────────── */

function stateBars(title, dims, values) {
  const group = node("div", "state-group");
  group.appendChild(node("div", "state-heading", title));
  for (const dim of dims) {
    const raw = values ? values[dim] : 0;
    const value = typeof raw === "number" ? Math.max(0, Math.min(1, raw)) : 0;

    const row = node("div", "bar-row");
    row.appendChild(node("span", "k", DIM_ZH[dim] || dim));
    const bar = node("span", "bar");
    const fill = node("span", "fill");
    fill.style.width = Math.round(value * 100) + "%";
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(node("span", "v", value.toFixed(2)));
    group.appendChild(row);
  }
  return group;
}

async function loadState() {
  try {
    const snapshot = await fetchJson("/v1/state", null, HEALTH_TIMEOUT_MS);
    el("state-bars").replaceChildren(
      stateBars("情绪", EMOTION_DIMS, snapshot.emotion),
      stateBars("关系", RELATIONSHIP_DIMS, snapshot.relationship)
    );
    el("state-foot").textContent = "更新于 " + String(snapshot.emotion_updated_at).slice(11, 19);
  } catch (error) {
    el("state-foot").textContent = "读取状态失败：" + error.message;
  }
}

function renderAvatarTags() {
  const box = el("avatar-tags");
  box.replaceChildren();
  if (app.avatar.expression) {
    box.appendChild(node("span", "tag accent", "表情 " + app.avatar.expression));
  }
  if (app.avatar.action) {
    box.appendChild(node("span", "tag accent", "动作 " + app.avatar.action));
  }
  if (!app.avatar.expression && !app.avatar.action) {
    box.appendChild(node("span", "tag", "还没有动作"));
  }
}

/* ── 对话区渲染 ───────────────────────────────────────── */

const SPEAKER = { user: "你", assistant: "Astra", failed: "系统" };

function chatAtBottom() {
  const box = el("chat");
  return box.scrollHeight - box.scrollTop - box.clientHeight < 80;
}

function scrollChat() {
  const box = el("chat");
  box.scrollTop = box.scrollHeight;
}

function createBubble(kind, text) {
  const box = el("chat");
  const stick = chatAtBottom();

  if (kind === "system") {
    const notice = node("div", "notice", text);
    box.appendChild(notice);
    if (stick) scrollChat();
    return notice;
  }

  const wrap = node("div", "msg " + kind);
  wrap.appendChild(node("div", "who", SPEAKER[kind] || ""));
  wrap.appendChild(node("div", "bubble", text));
  wrap.appendChild(node("div", "tags"));
  box.appendChild(wrap);
  if (stick) scrollChat();
  return wrap;
}

function addTags(wrap, tags) {
  const box = wrap.querySelector(".tags");
  if (!box) return;
  for (const tag of tags) {
    if (!tag || !tag.text) continue;
    box.appendChild(node("span", tag.cls ? "tag " + tag.cls : "tag", tag.text));
  }
}

function bubbleText(wrap) {
  return wrap.querySelector(".bubble");
}

//: 发消息时先放一个占位气泡，turn.started 到来后按 turn_id 认领
function startTurnBubble() {
  const wrap = createBubble("assistant", "…");
  bubbleText(wrap).classList.add("pending");
  app.unclaimed.push(wrap);
}

function claimTurnBubble(turnId) {
  const wrap = app.unclaimed.shift();
  if (wrap && turnId) app.turnBubbles.set(turnId, wrap);
}

//: 优先按 turn_id 找；找不到时退回最早的未认领气泡
//: （会话解析阶段就失败的那一轮不会发 turn.started，只有 turn.failed）
function bubbleFor(turnId) {
  if (turnId && app.turnBubbles.has(turnId)) return app.turnBubbles.get(turnId);
  return app.unclaimed.shift() || null;
}

function completeTurn(payload) {
  const wrap = bubbleFor(payload.turn_id);
  if (!wrap) return;
  const bubble = bubbleText(wrap);
  bubble.classList.remove("pending");
  bubble.textContent = payload.reply || "";

  const emotion = payload.emotion || {};
  const action = payload.action || {};
  const tags = [];
  if (emotion.primary) {
    tags.push({ text: "情绪 " + emotion.primary + " " + Number(emotion.intensity || 0).toFixed(2) });
  }
  if (action.name) {
    tags.push({ text: "动作 " + action.name + " " + Number(action.intensity || 0).toFixed(2) });
  }
  addTags(wrap, tags);
}

function interruptTurn(payload) {
  const wrap = bubbleFor(payload.turn_id);
  if (!wrap) return;
  if (payload.turn_id) app.turnBubbles.delete(payload.turn_id);

  wrap.classList.add("interrupted");
  const bubble = bubbleText(wrap);
  bubble.classList.remove("pending");
  if (bubble.textContent === "…") bubble.textContent = "（这一轮被打断了）";
  addTags(wrap, [{ text: "已被打断", cls: "warn" }]);
}

function failTurn(payload) {
  const wrap = bubbleFor(payload.turn_id);
  if (!wrap) return;
  if (payload.turn_id) app.turnBubbles.delete(payload.turn_id);

  wrap.classList.add("failed");
  const bubble = bubbleText(wrap);
  bubble.classList.remove("pending");
  bubble.textContent = payload.reply || payload.message || "这一轮失败了";
  addTags(wrap, [{ text: payload.code || "failed", cls: "warn" }]);
}

function finishTurn(payload) {
  const wrap = app.turnBubbles.get(payload.turn_id) || null;
  if (wrap) {
    const tags = [];
    if (typeof payload.total_ms === "number") {
      tags.push({ text: (payload.total_ms / 1000).toFixed(1) + "s" });
    }
    if (payload.retries) tags.push({ text: "重试 " + payload.retries, cls: "warn" });
    if (payload.degraded) tags.push({ text: "降级", cls: "warn" });
    addTags(wrap, tags);
    app.turnBubbles.delete(payload.turn_id);
  }
  loadMemories().catch(() => {});
  // 新消息会改到列表里的"最后一句"与条数——顺手刷新历史栏
  loadConversations().catch(() => {});
}

/* ── 事件分派 ─────────────────────────────────────────── */

function handleEvent(event) {
  const payload = event.payload || {};
  recordEvent(event.type, payload);

  if (event.type === "conversation.created" || event.type === "turn.started") {
    setConversation(payload.conversation_id);
  }

  switch (event.type) {
    case "turn.started":
      claimTurnBubble(payload.turn_id);
      break;
    case "assistant.text.completed":
      completeTurn(payload);
      break;
    case "turn.completed":
      finishTurn(payload);
      break;
    case "turn.interrupted":
      interruptTurn(payload);
      // 服务端只能停止"继续发送"；已经推过来的声音要客户端自己停（docs/10 §7 Scenario D）
      stopPlayback();
      setVoiceStatus("已被打断", { state: "idle" });
      break;
    case "turn.failed":
      failTurn(payload);
      break;
    case "state.emotion.updated":
    case "state.relationship.updated":
      loadState().catch(() => {});
      break;
    case "avatar.expression.set":
      app.avatar.expression = payload.emotion || null;
      renderAvatarTags();
      break;
    case "avatar.action.play":
      app.avatar.action = payload.name || null;
      renderAvatarTags();
      break;
    case "memory.created":
    case "memory.updated":
    case "memory.archived":
    case "memory.deleted":
      loadMemories().catch(() => {});
      break;
    case "stt.final": {
      if (app.voice.preview) {
        // 预览模式：只填进输入框，**不自动发**——本地 STT 错字多，改完再发（ADR 0028）
        const input = el("text");
        input.value = payload.text || "";
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
        setVoiceStatus("已识别：改完错别字按回车发送", { state: "idle" });
        break;
      }
      const heard = createBubble("user", payload.text || "");
      addTags(heard, [{ text: "语音识别" }]);
      setVoiceStatus("已识别，等待回复…", { state: "recognizing" });
      break;
    }
    case "tts.started":
      ensurePlaybackContext(Number(payload.sample_rate) || 24000);
      app.voice.expectedChunks = Number(payload.chunk_count) || 0;
      app.voice.chunks = 0;
      setVoiceStatus("播放中…", { state: "playing" });
      break;
    case "tts.completed":
      if (payload.status === "failed") {
        setVoiceStatus("语音合成失败：" + (payload.code || ""), { warn: true, state: "idle" });
      } else if (app.voice.chunks !== app.voice.expectedChunks) {
        // 队满时"淘汰最旧"可能丢掉音频中间帧（ADR 0021 的已知局限）
        createBubble("system",
          "音频块数对不上：收到 " + app.voice.chunks + " / 期望 " + app.voice.expectedChunks);
        setVoiceStatus("播放中（有丢帧）", { warn: true, state: "idle" });
      } else {
        setVoiceStatus("就绪", { state: "idle" });
      }
      break;
    case "error.protocol": {
      const code = String(payload.code || "");
      createBubble("system", "协议提示：" + (payload.message || code));
      if (code.indexOf("stt") >= 0 || code.indexOf("tts") >= 0) {
        setVoiceStatus("语音后端报错：" + code, { warn: true, state: "idle" });
      }
      break;
    }
    default:
      break;
  }
}

/* ── WebSocket ────────────────────────────────────────── */

function socketOpen() {
  return app.socket !== null && app.socket.readyState === WebSocket.OPEN;
}

function sendFrame(type, payload) {
  if (!socketOpen()) return false;
  app.socket.send(JSON.stringify({ type, version: 1, payload }));
  recordEvent("→ " + type, payload);
  return true;
}

//: 走 WS 而不是 ``POST /v1/chat/messages``：只有 WS 路径带 barge-in
//: （服务端在起新 turn 前先取消同连接上的旧 turn，`docs/01` §4.6）
function sendText(text) {
  // 带上 conversation_id：不然服务端只会往"最近一段 active 会话"里写，
  // 用户在历史栏点开旧会话再说话就会跑到别处去
  return sendFrame("input.user_text", { text: text, conversation_id: app.conversationId });
}

function scheduleReconnect() {
  clearTimeout(app.reconnectTimer);
  app.reconnectTimer = setTimeout(() => {
    app.reconnectDelayMs = Math.min(app.reconnectDelayMs * 2, WS_RECONNECT_MAX_MS);
    connect();
  }, app.reconnectDelayMs);
}

function afterReconnect() {
  // 断线期间跑完的 turn 不会补发事件（后端契约：断线不取消 turn）——靠历史接口补齐。
  // 有在跑的气泡时不拉，免得把它冲掉。
  if (!app.conversationId) return;
  if (app.unclaimed.length > 0 || app.turnBubbles.size > 0) return;
  loadHistory().catch(() => {});
}

function connect() {
  const scheme = location.protocol === "https:" ? "wss://" : "ws://";
  const url = scheme + location.host + "/ws/v1/session/" + app.sessionId;
  const socket = new WebSocket(url);
  socket.binaryType = "arraybuffer";
  app.socket = socket;
  setConnection("connecting", "连接中…");

  socket.addEventListener("open", () => {
    app.reconnectDelayMs = 1000;
    setConnection("ok", "已连接");
    // 重连后补发一次语音模式——否则断线期间切过的开关会丢（/dev 的教训）
    sendFrame("session.voice_mode.set", { enabled: el("voice-mode").checked });
    sendFrame("session.stt_preview.set", { enabled: app.voice.preview });
    syncVoiceAvailability();
    loadConversations().catch(() => {});
    if (app.connectedOnce) {
      createBubble("system", "已重新连上后端。");
      afterReconnect();
    }
    app.connectedOnce = true;
  });
  socket.addEventListener("close", () => {
    setConnection("down", "连接断开，重连中…");
    stopRecording();
    stopPlayback();
    setTalking(false);
    syncVoiceAvailability();
    scheduleReconnect();
  });
  socket.addEventListener("error", () => setConnection("down", "连接出错，重连中…"));
  socket.addEventListener("message", (message) => {
    if (message.data instanceof ArrayBuffer) {
      // 二进制帧 = TTS 音频（ADR 0021 的既有语义）
      app.voice.chunks += 1;
      playAudioChunk(message.data);
      return;
    }
    let event;
    try {
      event = JSON.parse(message.data);
    } catch {
      return;
    }
    handleEvent(event);
  });
}

/* ── 语音：照 /dev 已验收的链路移植，协议一行不改（ADR 0027 §1）── */

//: 采集采样率。服务端**不做重采样**，声明的格式与它配置的不符会被拒绝（ADR 0022）
const INPUT_SAMPLE_RATE = 16000;

function setVoiceStatus(text, options) {
  const opts = options || {};
  const box = el("voice-status");
  box.textContent = text;
  box.className = opts.warn ? "voice-status warn" : "voice-status";
  if (opts.state) app.voice.state = opts.state;
}

function setTalking(talking) {
  el("talk").classList.toggle("active", talking);
  el("talk").textContent = talking ? "松开结束" : "按住说话";
}

//: 语音组件能不能用，只信 /health（不假装按钮能用）
function syncVoiceAvailability() {
  const stt = app.voice.stt;
  const tts = app.voice.tts;

  if (stt === "unknown" || tts === "unknown") {
    el("talk").disabled = true;
    el("voice-mode").disabled = true;
    setVoiceStatus("正在探测语音组件…");
    return;
  }

  const sttReady = stt === "ok";
  const ttsReady = tts === "ok";
  el("talk").disabled = !sttReady || !socketOpen();
  el("voice-mode").disabled = !ttsReady;
  if (!ttsReady) el("voice-mode").checked = false;

  if (app.voice.state !== "idle" && app.voice.state !== "blocked") return;

  if (sttReady && ttsReady) {
    setVoiceStatus("就绪", { state: "idle" });
    return;
  }
  const parts = [];
  if (!sttReady) parts.push("语音输入 " + describeVoice(stt));
  if (!ttsReady) parts.push("语音回复 " + describeVoice(tts));
  setVoiceStatus(parts.join(" · ") + " —— 去「设置」页配好再保存并重启", {
    warn: true,
    state: "blocked",
  });
}

function describeVoice(status) {
  if (status === "not_configured") return "未配置";
  if (status === "down") return "连不上（CosyVoice 没在跑？）";
  return "不可用（" + status + "）";
}

async function startRecording() {
  if (app.voice.processor) return true;

  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
  });
  // 直接用 16 kHz 的 AudioContext，省掉自己写重采样
  const context = new AudioContext({ sampleRate: INPUT_SAMPLE_RATE });
  if (context.sampleRate !== INPUT_SAMPLE_RATE) {
    await context.close();
    stream.getTracks().forEach((track) => track.stop());
    createBubble("system",
      "浏览器拒绝了 " + INPUT_SAMPLE_RATE + " Hz 的采集（实际 " + context.sampleRate + " Hz），语音输入用不了。");
    return false;
  }

  const source = context.createMediaStreamSource(stream);
  const processor = context.createScriptProcessor(4096, 1, 1);
  const mute = context.createGain();
  mute.gain.value = 0;              // 不把自己的声音放出来（否则会啸叫）
  processor.connect(mute);
  mute.connect(context.destination);

  processor.onaudioprocess = (event) => {
    const input = event.inputBuffer.getChannelData(0);
    const pcm = new Int16Array(input.length);
    for (let i = 0; i < input.length; i += 1) {
      pcm[i] = Math.round(Math.max(-1, Math.min(1, input[i])) * 32767);
    }
    if (socketOpen()) app.socket.send(pcm.buffer);
  };
  source.connect(processor);

  app.voice.mic = context;
  app.voice.stream = stream;
  app.voice.processor = processor;
  return true;
}

function stopRecording() {
  const voice = app.voice;
  if (voice.processor) {
    voice.processor.onaudioprocess = null;
    voice.processor.disconnect();
    voice.processor = null;
  }
  if (voice.stream) {
    voice.stream.getTracks().forEach((track) => track.stop());
    voice.stream = null;
  }
  if (voice.mic) {
    voice.mic.close().catch(() => {});
    voice.mic = null;
  }
}

function stopPlayback() {
  for (const source of app.voice.sources) {
    try { source.stop(); } catch { /* 已经播完的节点 stop 会抛，忽略 */ }
  }
  app.voice.sources.clear();
  app.voice.nextPlayTime = 0;
}

function ensurePlaybackContext(sampleRate) {
  const voice = app.voice;
  if (voice.playback && voice.playbackRate === sampleRate) return voice.playback;
  stopPlayback();
  if (voice.playback) voice.playback.close().catch(() => {});
  voice.playback = new AudioContext({ sampleRate: sampleRate });
  voice.playbackRate = sampleRate;
  return voice.playback;
}

function playAudioChunk(buffer) {
  const playback = app.voice.playback;
  if (!playback) return;

  const samples = new Int16Array(buffer);
  const audioBuffer = playback.createBuffer(1, samples.length, playback.sampleRate);
  const channel = audioBuffer.getChannelData(0);
  for (let i = 0; i < samples.length; i += 1) channel[i] = samples[i] / 32768;

  const source = playback.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(playback.destination);

  // 逐块排队播放：每块接在上一次结束的位置，听起来是连续的
  const startAt = Math.max(playback.currentTime, app.voice.nextPlayTime);
  source.start(startAt);
  app.voice.nextPlayTime = startAt + audioBuffer.duration;

  app.voice.sources.add(source);
  source.onended = () => app.voice.sources.delete(source);
}

async function beginTalk() {
  if (app.voice.processor || app.voice.starting) return;
  if (!socketOpen()) {
    createBubble("system", "还没连上后端，稍等一下再按住说话。");
    return;
  }
  if (app.voice.stt !== "ok") {
    syncVoiceAvailability();
    createBubble("system", "现在不能语音输入（" + describeVoice(app.voice.stt) + "）：去「设置」页配好语音组件再保存并重启。");
    return;
  }

  setTalking(true);
  setVoiceStatus("正在听…", { state: "listening" });

  // 启动是异步的（第一次还要等麦克风授权）：这期间松手要记住，
  // 否则会留下一个**一直开着**的话筒（第一次"识别不了"就是这么来的）
  app.voice.starting = true;
  app.voice.released = false;

  let started = false;
  try {
    started = await startRecording();
  } catch (error) {
    createBubble("system", "拿不到麦克风：" + error.message);
  }
  app.voice.starting = false;

  if (!started) {
    setTalking(false);
    setVoiceStatus("麦克风不可用", { warn: true, state: "idle" });
    return;
  }
  if (app.voice.released) {
    // 松手发生在启动期间：这一段直接丢掉，别留下开着的话筒
    stopRecording();
    setTalking(false);
    setVoiceStatus("这一段没录到（第一次要先允许麦克风）——再按一次试试", {
      warn: true, state: "idle",
    });
    return;
  }
  // 先声明格式再送字节——服务端按这条声明解释后面的二进制帧
  sendFrame("input.audio.started", {
    encoding: "pcm16", sample_rate: INPUT_SAMPLE_RATE, channels: 1,
    conversation_id: app.conversationId,
  });
}

function endTalk() {
  if (app.voice.starting) {
    app.voice.released = true;   // 交给启动流程收尾
    return;
  }
  if (!app.voice.processor) return;
  sendFrame("input.audio.stopped", {});
  stopRecording();
  setTalking(false);
  setVoiceStatus("识别中…", { state: "recognizing" });
}

/* ── 会话列表（左侧历史栏）────────────────────────────── */

function formatWhen(iso) {
  if (!iso) return "—";
  const when = new Date(iso);
  const now = new Date();
  const clock = String(when.getHours()).padStart(2, "0") + ":" + String(when.getMinutes()).padStart(2, "0");
  if (when.toDateString() === now.toDateString()) return clock;
  return (when.getMonth() + 1) + "-" + when.getDate() + " " + clock;
}

function renderConversations() {
  const box = el("conv-list");
  box.replaceChildren();

  if (app.conversations.length === 0) {
    box.appendChild(node("p", "notice", "还没有过往会话。说第一句话就会开一段。"));
    return;
  }

  for (const item of app.conversations) {
    const active = item.conversation_id === app.conversationId;
    const row = node("div", "conv-row");

    const button = node("button", "conv-item" + (active ? " active" : ""));
    button.type = "button";
    button.appendChild(node("div", "when",
      formatWhen(item.last_message_at || item.started_at)
      + " · " + item.message_count + " 条"
      + (item.status === "ended" ? " · 已结束" : "")));
    button.appendChild(node("div", "what", item.last_message_preview || "（还没有消息）"));
    button.addEventListener("click", () => {
      openConversation(item).catch((error) => createBubble("system", "打开会话失败：" + error.message));
    });
    row.appendChild(button);

    const remove = node("button", "conv-del", "删");
    remove.type = "button";
    remove.title = "删除这段会话（真实删除，不可恢复）";
    // 当前会话正在跑 turn 时不许删：那一轮落库会把消息写进已删的会话（ADR 0029）
    if (active && app.turnBubbles.size > 0) {
      remove.disabled = true;
      remove.title = "这一轮还在跑——等她说完再删";
    }
    remove.addEventListener("click", () => {
      deleteConversation(item).catch((error) => createBubble("system", "删除会话失败：" + error.message));
    });
    row.appendChild(remove);

    box.appendChild(row);
  }
}

async function loadConversations() {
  const page = await fetchJson("/v1/conversations?limit=50", null, 15000);
  app.conversations = page.conversations || [];
  renderConversations();
  return app.conversations;
}

async function openConversation(item) {
  app.conversationId = item.conversation_id;
  app.conversationStatus = item.status;
  writeStored(STORE_KEY, item.conversation_id);
  el("conversation-label").textContent = "会话 " + item.conversation_id.slice(0, 8)
    + (item.status === "ended" ? " · 已结束" : "");
  renderConversations();

  await loadHistory();
  if (item.status === "ended") {
    // 端到端契约：已结束的会话不接受新消息（ADR 0012）——先把话说在前面
    createBubble("system", "这段会话已经结束（只读）。历史还在，但接着聊要开新的一段——点右上角「新会话」。");
  }
}

async function deleteConversation(item) {
  const preview = item.last_message_preview || "（还没有消息）";
  const confirmed = window.confirm(
    "删除这段会话？\n\n" + preview + "\n\n真实删除它和全部消息，不可恢复。\n"
    + "（从它里面记住的事不受影响，仍可在记忆页单独删。）"
  );
  if (!confirmed) return;

  await fetchJson("/v1/conversations/" + encodeURIComponent(item.conversation_id),
    { method: "DELETE" }, HEALTH_TIMEOUT_MS);

  if (item.conversation_id === app.conversationId) {
    // 删掉的就是当前这一段：本地引用一起清掉，下一次发送会自动开新的一段
    app.conversationId = null;
    app.conversationStatus = null;
    writeStored(STORE_KEY, "");
    app.unclaimed.length = 0;
    app.turnBubbles.clear();
    el("chat").replaceChildren();
    el("conversation-label").textContent = "已删除当前会话";
    createBubble("system", "这段会话已删除（消息一起没了）。发消息会开新的一段。");
  }
  await loadConversations();
}

/* ── 会话与历史 ───────────────────────────────────────── */

function setConversation(conversationId) {
  if (!conversationId) return;
  app.conversationId = conversationId;
  app.conversationStatus = "active";
  writeStored(STORE_KEY, conversationId);
  el("conversation-label").textContent = "会话 " + conversationId.slice(0, 8) + " · 已记住";
  renderConversations();
}

async function startNewConversation() {
  const body = await fetchJson("/v1/conversations", { method: "POST" }, HEALTH_TIMEOUT_MS);
  app.unclaimed.length = 0;
  app.turnBubbles.clear();
  el("chat").replaceChildren();
  setConversation(body.conversation_id);
  createBubble("system", "已开一段新会话。旧会话的历史与记忆都还在——左边那一栏随时能翻回去。");
  await loadConversations();
}

async function loadHistory() {
  if (!app.conversationId) {
    createBubble("system", "还不知道是哪段会话——先发一条消息，或点「新会话」。");
    return;
  }
  const url = "/v1/conversations/" + encodeURIComponent(app.conversationId) + "/messages";
  const history = await fetchJson(url, null, HEALTH_TIMEOUT_MS);
  const messages = history.messages.slice(-HISTORY_LIMIT);

  app.unclaimed.length = 0;
  app.turnBubbles.clear();
  el("chat").replaceChildren();

  if (messages.length === 0) {
    createBubble("system", "这段会话还没有消息。");
    return;
  }
  for (const message of messages) {
    const kind = message.role === "user" ? "user" : "assistant";
    const wrap = createBubble(kind, message.content);
    const status = message.metadata ? message.metadata.status : null;
    if (status) addTags(wrap, [{ text: String(status), cls: status === "ok" ? "" : "warn" }]);
  }
}

function restoreConversation() {
  const stored = readStored(STORE_KEY);
  if (!stored) return;
  app.conversationId = stored;
  el("conversation-label").textContent = "会话 " + stored.slice(0, 8);
  loadHistory().catch(() => {
    // 已结束 / 被删的会话：清掉本地记录，下一次发送会自动开始新的一段
    app.conversationId = null;
    writeStored(STORE_KEY, "");
    el("conversation-label").textContent = "上一段会话已结束";
    el("chat").replaceChildren();
    createBubble("system", "上一段会话已经结束（服务端关闭或空闲超时）。直接发消息就会开始新的一段。");
  });
}

/* ── 记忆页 ───────────────────────────────────────────── */

function memoryListUrl() {
  return app.memoryQuery
    ? "/v1/memories?query=" + encodeURIComponent(app.memoryQuery)
    : "/v1/memories";
}

function memoryCard(memory) {
  const card = node("article", "mem");

  const top = node("div", "top");
  top.appendChild(node("span", "type", MEMORY_TYPE_ZH[memory.type] || memory.type));
  top.appendChild(node("span", "metrics",
    "重要 " + Number(memory.importance).toFixed(2) +
    " · 置信 " + Number(memory.confidence).toFixed(2)));
  card.appendChild(top);

  card.appendChild(node("p", "text", memory.content));

  const foot = node("div", "foot");
  foot.appendChild(node("span", null, String(memory.created_at).slice(0, 10)));
  foot.appendChild(node("span", null, memory.expires_at ? "到期 " + String(memory.expires_at).slice(0, 10) : "长期"));

  const actions = node("div", "actions");
  const edit = node("button", null, "编辑");
  edit.type = "button";
  edit.addEventListener("click", () => openEditor(memory));
  const remove = node("button", "danger", "删除");
  remove.type = "button";
  remove.addEventListener("click", () => { deleteMemory(memory).catch(reportMemoryError); });
  actions.append(edit, remove);
  foot.appendChild(actions);

  card.appendChild(foot);
  return card;
}

function renderMemories() {
  const list = el("memory-list");
  list.replaceChildren();
  if (app.memories.length === 0) {
    list.appendChild(node("p", "notice",
      app.memoryQuery ? "没有找到相关记忆。" : "还没有记忆。聊几句，或明确告诉她一个稳定偏好。"));
    return;
  }
  for (const memory of app.memories) list.appendChild(memoryCard(memory));
}

function reportMemoryError(error) {
  el("memory-summary").textContent = "出错了：" + error.message;
}

async function loadMemories() {
  const [settings, page] = await Promise.all([
    fetchJson("/v1/memories/settings", null, HEALTH_TIMEOUT_MS),
    fetchJson(memoryListUrl(), null, 15000),
  ]);
  el("memory-enabled").checked = settings.enabled;
  app.memories = page.memories;
  app.memoryTotal = page.total;
  renderMemories();

  if (app.memoryQuery) {
    el("memory-summary").textContent =
      "「" + app.memoryQuery + "」命中 " + page.total + " 条（按相关度排序）";
  } else {
    el("memory-summary").textContent =
      "共 " + page.total + " 条" + (settings.enabled ? "" : " · 记忆已关闭（不写入、不检索）");
  }
}

async function deleteMemory(memory) {
  const preview = memory.content.length > 60 ? memory.content.slice(0, 60) + "…" : memory.content;
  const confirmed = window.confirm("删除这条记忆？\n\n" + preview + "\n\n真实删除，不可恢复。");
  if (!confirmed) return;
  await fetchJson("/v1/memories/" + encodeURIComponent(memory.id), { method: "DELETE" }, HEALTH_TIMEOUT_MS);
  await loadMemories();
}

async function clearMemories() {
  const confirmed = window.confirm(
    "清空全部 " + app.memoryTotal + " 条记忆？\n\n真实删除，不可恢复。（需要备份就先点「导出」）");
  if (!confirmed) return;
  await fetchJson("/v1/memories/clear", { method: "POST" }, 20000);
  await loadMemories();
}

async function exportMemories() {
  const data = await fetchJson("/v1/memories/export", null, 20000);
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "astra-memories-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function setMemoryEnabled(enabled) {
  await fetchJson("/v1/memories/settings", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ enabled: enabled }),
  }, HEALTH_TIMEOUT_MS);
  await loadMemories();
}

function openEditor(memory) {
  app.editingId = memory.id;
  el("edit-content").value = memory.content;
  el("edit-type").value = MEMORY_TYPE_ZH[memory.type] ? memory.type : "semantic";
  el("edit-importance").value = memory.importance;
  el("edit-confidence").value = memory.confidence;
  el("edit-error").textContent = "";
  el("memory-edit").showModal();
}

async function saveEditor() {
  const memoryId = app.editingId;
  if (!memoryId) return;
  const content = el("edit-content").value.trim();
  if (!content) {
    el("edit-error").textContent = "内容不能为空。";
    return;
  }
  try {
    await fetchJson("/v1/memories/" + encodeURIComponent(memoryId), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content: content,
        type: el("edit-type").value,
        importance: Number(el("edit-importance").value),
        confidence: Number(el("edit-confidence").value),
      }),
    }, 15000);
  } catch (error) {
    el("edit-error").textContent = "保存失败：" + error.message;
    return;
  }
  app.editingId = null;
  el("memory-edit").close();
  await loadMemories();
}

/* ── 设置页：写 .env + 一键重启（ADR 0026）────────────── */

const SOURCE_ZH = { env: "进程环境", file: ".env", default: "默认值" };

function reportConfigError(error) {
  const banner = el("config-banner");
  banner.replaceChildren(node("p", "note danger", "设置页出错：" + error.message));
  banner.hidden = false;
}

function configControl(field) {
  let control;
  if (field.kind === "enum") {
    control = node("select");
    for (const choice of field.choices) {
      const option = node("option", null, choice);
      option.value = choice;
      control.appendChild(option);
    }
    control.value = field.value;
  } else if (field.kind === "bool") {
    control = node("input");
    control.type = "checkbox";
    control.checked = field.value.trim().toLowerCase() === "true";
  } else if (field.kind === "int" || field.kind === "float") {
    control = node("input");
    control.type = "number";
    control.step = field.kind === "float" ? "any" : "1";
    control.value = field.value;
  } else {
    control = node("input");
    control.type = "text";
    control.value = field.value;
    control.spellcheck = false;
  }
  control.dataset.key = field.key;
  return control;
}

function configRow(field) {
  const row = node("div", "cfg-row");

  const head = node("div", "cfg-head");
  head.appendChild(node("span", "cfg-label", field.label));
  head.appendChild(node("span", "cfg-key", field.key));
  row.appendChild(head);

  const line = node("div", "cfg-line");
  line.appendChild(configControl(field));
  const badges = node("div", "cfg-badges");
  badges.appendChild(node("span", "badge" + (field.source === "env" ? " warn" : ""),
    SOURCE_ZH[field.source] || field.source));
  if (field.restart_pending) badges.appendChild(node("span", "badge warn", "重启后生效"));
  line.appendChild(badges);
  row.appendChild(line);

  if (field.source === "env") {
    row.appendChild(node("p", "cfg-hint",
      "当前生效值 " + field.effective + " 来自进程环境——写 .env 不会改变它，" +
      "除非启动时不再内联这个变量。"));
  } else if (field.restart_pending) {
    row.appendChild(node("p", "cfg-hint",
      "当前生效值 " + field.effective + "，重启后才会换成上面这个值。"));
  } else if (field.value !== field.effective) {
    row.appendChild(node("p", "cfg-hint", "当前生效值 " + field.effective));
  }
  return row;
}

function renderConfigBanner(config) {
  const banner = el("config-banner");
  banner.replaceChildren();
  const notes = [];
  if (!config.supervised) {
    notes.push({
      cls: "warn",
      text: "后端不是以监督模式启动的（--no-supervisor）：「保存并重启」不可用，改完请自己去终端重启。",
    });
  }
  if (config.unknown_keys.length) {
    notes.push({
      cls: "danger",
      text: ".env 里有后端不认识的键——它们会让下次启动直接失败：" + config.unknown_keys.join("、"),
    });
  }
  if (config.restart_pending.length) {
    notes.push({
      cls: "warn",
      text: "有 " + config.restart_pending.length + " 项已改但还没生效（重启后才会用上新值）。",
    });
  }
  for (const note of notes) banner.appendChild(node("p", "note " + note.cls, note.text));
  banner.hidden = notes.length === 0;
}

function renderAdminConfig(config) {
  const box = el("config-body");
  box.replaceChildren();

  const groups = new Map();
  for (const field of config.fields) {
    if (!groups.has(field.group)) groups.set(field.group, []);
    groups.get(field.group).push(field);
  }
  for (const [name, fields] of groups) {
    const section = node("section", "cfg-group");
    section.appendChild(node("h2", null, name));
    for (const field of fields) section.appendChild(configRow(field));
    box.appendChild(section);
  }

  el("config-sub").textContent = config.env_file +
    (config.env_exists ? "" : "（还不存在：保存时会先从 .env.example 复制一份）");
  el("config-save-restart").disabled = !config.supervised || app.restarting;
  renderConfigBanner(config);
}

async function loadAdminConfig() {
  const config = await fetchJson("/v1/admin/config", null, 15000);
  app.adminConfig = config;
  renderAdminConfig(config);
  return config;
}

function sameValue(kind, left, right) {
  if (kind === "int" || kind === "float") {
    const a = Number(left);
    const b = Number(right);
    if (left !== "" && right !== "" && !Number.isNaN(a) && !Number.isNaN(b)) return a === b;
  }
  return left === right.trim();
}

function collectChanges() {
  const config = app.adminConfig;
  const changes = {};
  if (!config) return changes;
  const byKey = new Map(config.fields.map((field) => [field.key, field]));

  for (const control of el("config-body").querySelectorAll("[data-key]")) {
    const field = byKey.get(control.dataset.key);
    if (!field) continue;
    const raw = field.kind === "bool"
      ? (control.checked ? "true" : "false")
      : control.value.trim();
    if (!sameValue(field.kind, raw, field.value)) changes[field.key] = raw;
  }
  return changes;
}

function putAdminConfig(changes) {
  return fetchJson("/v1/admin/config", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ values: changes }),
  }, 30000);
}

function setRestarting(on, text) {
  app.restarting = on;
  el("restart-veil").hidden = !on;
  if (text) el("restart-text").textContent = text;
  el("config-save").disabled = on;
  el("config-reload").disabled = on;
  el("config-save-restart").disabled = on || !(app.adminConfig && app.adminConfig.supervised);
}

async function saveAdminConfig() {
  const changes = collectChanges();
  if (Object.keys(changes).length === 0) {
    createBubble("system", "设置页：没有改动。");
    return null;
  }
  const result = await putAdminConfig(changes);
  createBubble("system", "已写入 " + result.written.length + " 项到 " + result.env_file + "。");
  await loadAdminConfig();
  return result;
}

async function waitForBackend(attempts) {
  for (let index = 0; index < attempts; index += 1) {
    try {
      await fetchJson("/health", null, 2000);
      return true;
    } catch {
      await new Promise((resolve) => setTimeout(resolve, 1000));
    }
  }
  return false;
}

//: 后端是不是监督模式。设置页与人格页各自问过同一件事——谁先加载就用谁的结果
function backendSupervised() {
  return Boolean((app.adminConfig && app.adminConfig.supervised)
    || (app.personas && app.personas.supervised));
}

async function restartBackend() {
  if (app.restarting) return;
  if (!backendSupervised()) {
    createBubble("system", "这个后端不是监督模式，重启按钮不可用。");
    return;
  }

  setRestarting(true, "后端正在重启…");
  try {
    await fetchJson("/v1/admin/restart", { method: "POST" }, 5000);
  } catch (error) {
    const message = String(error.message || "");
    if (message.indexOf("409") >= 0) {
      setRestarting(false);
      createBubble("system", "重启被拒绝：" + message);
      return;
    }
    // 其余情况多半是"响应还没读完进程就退了"——那本来就是重启的样子，继续等它回来
  }

  setRestarting(true, "后端正在重启…（在跑的对话会中断）");
  const back = await waitForBackend(30);
  setRestarting(false);
  if (!back) {
    createBubble("system",
      "等了 30 秒也没等到后端回来：看终端里的报错（配置写坏时它会直接退出，不会反复重启）。");
    return;
  }
  createBubble("system", "后端已用新配置起来了。");
  await loadAdminConfig();
  refreshHealth().catch(() => {});
  loadState().catch(() => {});
}

async function saveAndRestart() {
  if (app.restarting) return;
  try {
    const changes = collectChanges();
    if (Object.keys(changes).length > 0) {
      const result = await putAdminConfig(changes);
      createBubble("system", "已写入 " + result.written.length + " 项，接着重启。");
    }
  } catch (error) {
    createBubble("system", "保存失败（没有重启）：" + error.message);
    return;
  }
  await restartBackend();
}

/* ── 模型页：LM Studio（显存策略是声明值）─────────────── */

function formatBytes(value) {
  if (typeof value !== "number" || value <= 0) return "—";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let size = value;
  let unit = 0;
  while (size >= 1024 && unit < units.length - 1) {
    size /= 1024;
    unit += 1;
  }
  return size.toFixed(unit >= 3 ? 2 : 0) + " " + units[unit];
}

function reportModelsError(error) {
  const banner = el("models-banner");
  banner.replaceChildren(node("p", "note danger", "模型页出错：" + error.message));
  banner.hidden = false;
}

function fillModelOptions(models) {
  const select = el("lms-model-key");
  select.replaceChildren();
  for (const model of models) {
    const option = node("option", null, model.display_name + "（" + model.key + "）");
    option.value = model.key;
    select.appendChild(option);
  }
}

function renderLoaded(status) {
  const box = el("lms-loaded");
  box.replaceChildren();
  if (status.loaded.length === 0) {
    box.appendChild(node("p", "notice", "当前没有加载任何模型。"));
    return;
  }
  for (const item of status.loaded) {
    const row = node("div", "cfg-row");
    const head = node("div", "cfg-head");
    head.appendChild(node("span", "cfg-label", item.identifier));
    head.appendChild(node("span", "cfg-key",
      "ctx " + (item.context_length || "?") + " · " + formatBytes(item.size_bytes)));
    row.appendChild(head);

    const line = node("div", "cfg-line");
    const unload = node("button", "danger", "卸载");
    unload.type = "button";
    unload.addEventListener("click", () => {
      lmsAction("/unload", { identifier: item.identifier }, 65000,
        "已请求卸载 " + item.identifier).catch(reportModelsError);
    });
    line.appendChild(unload);
    row.appendChild(line);
    box.appendChild(row);
  }
}

function renderModelTable(status) {
  const box = el("lms-models");
  box.replaceChildren();
  if (status.models.length === 0) {
    box.appendChild(node("p", "notice",
      status.cli.available ? "LM Studio 里还没有本地模型。" : "找到 lms 之后才能列出模型。"));
    return;
  }
  for (const model of status.models) {
    const row = node("div", "cfg-row");
    const head = node("div", "cfg-head");
    head.appendChild(node("span", "cfg-label", model.display_name));
    head.appendChild(node("span", "cfg-key", model.key));
    head.appendChild(node("span", "badge",
      model.model_type + (model.params ? " · " + model.params : "")));
    head.appendChild(node("span", "badge", formatBytes(model.size_bytes)));
    head.appendChild(node("span", "badge", "ctx " + (model.max_context || "?")));
    row.appendChild(head);
    box.appendChild(row);
  }
}

function renderDeclared(status) {
  const line = el("lms-declared");
  if (!status.declared) {
    line.textContent = "还没有通过 Studio 加载过模型（没有声明值可显示）。";
    return;
  }
  const declared = status.declared;
  line.textContent = "上次由 Studio 下发：--gpu " + declared.gpu +
    "（" + declared.model_key +
    (declared.context_length ? "，ctx " + declared.context_length : "") +
    "，于 " + declared.at.replace("T", " ").slice(0, 19) + "）——声明值，不是实测。";
}

function renderLmStudio(status) {
  const banner = el("models-banner");
  banner.replaceChildren();
  banner.hidden = true;

  const dot = status.server === "running" ? "ok" : (status.server === "stopped" ? "down" : "");
  el("lms-dot").className = "dot " + dot;
  el("lms-server-text").textContent = status.server === "running"
    ? "服务在跑" : (status.server === "stopped" ? "服务已停" : "服务状态未知");
  el("lms-cli").textContent = status.cli.available
    ? "lms：" + status.cli.path + (status.server_output ? " · " + status.server_output : "")
    : (status.cli.message || "找不到 lms");
  el("models-sub").textContent =
    status.models.length + " 个本地模型 · " + status.loaded.length + " 个已加载";

  fillModelOptions(status.models);
  renderLoaded(status);
  renderModelTable(status);
  renderDeclared(status);
}

async function loadLmStudio() {
  const status = await fetchJson("/v1/admin/lmstudio", null, 30000);
  app.lmstudio = status;
  renderLmStudio(status);
  return status;
}

async function lmsAction(path, body, timeoutMs, note) {
  const buttons = document.querySelectorAll("#page-models button");
  for (const button of buttons) button.disabled = true;
  try {
    const result = await fetchJson("/v1/admin/lmstudio" + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    }, timeoutMs);
    const extra = result.stdout ? "：" + result.stdout.trim().slice(0, 200) : "";
    createBubble("system", note + extra);
  } finally {
    for (const button of buttons) button.disabled = false;
  }
  await loadLmStudio();
}

/* ── 事件页（纯前端环形缓冲）──────────────────────────── */

const EVENTS_LIMIT = 300;

function eventRow(item) {
  const row = node("div", "evt");
  row.appendChild(node("span", "evt-time", item.at));
  row.appendChild(node("span", "evt-type", item.type));
  row.appendChild(node("span", "evt-payload", JSON.stringify(item.payload)));
  return row;
}

function recordEvent(type, payload) {
  const item = {
    at: new Date().toLocaleTimeString("zh-CN", { hour12: false }),
    type: type,
    payload: payload === undefined ? null : payload,
  };
  app.events.push(item);
  if (app.events.length > EVENTS_LIMIT) app.events.shift();
  if (el("events-pause").checked) return;

  const box = el("events-list");
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.appendChild(eventRow(item));
  while (box.childElementCount > EVENTS_LIMIT) box.removeChild(box.firstElementChild);
  if (stick) box.scrollTop = box.scrollHeight;
}

function renderEvents() {
  const box = el("events-list");
  box.replaceChildren();
  for (const item of app.events) box.appendChild(eventRow(item));
  box.scrollTop = box.scrollHeight;
}

/* ── 动画页：后端托管的映射（ADR 0027 §2 / §3）────────── */

const ANIME_POSES = ["sit", "lie"];

function reportAnimeError(error) {
  const banner = el("anime-banner");
  banner.replaceChildren(node("p", "note danger", "动画页出错：" + error.message));
  banner.hidden = false;
}

//: 三个块都补成数组，后面的编辑逻辑才好直接改；未知字段原样留着（保存时一起 PUT 回去）
function normalizeAnime(raw) {
  const config = raw && typeof raw === "object" ? raw : {};
  if (!Array.isArray(config.idlePool)) config.idlePool = [];
  if (!Array.isArray(config.actions)) config.actions = [];
  if (!Array.isArray(config.poses)) config.poses = [];
  return config;
}

function animeClipRow(ref, list, rerender) {
  const row = node("div", "anime-clip");

  const clip = node("input");
  clip.type = "text";
  clip.spellcheck = false;
  clip.placeholder = "clip 名（Unity 里那个）";
  clip.value = typeof ref.clip === "string" ? ref.clip : "";
  clip.addEventListener("input", () => { ref.clip = clip.value; });
  row.appendChild(clip);

  const weight = node("input");
  weight.type = "number";
  weight.step = "any";
  weight.min = "0";
  weight.value = typeof ref.weight === "number" ? String(ref.weight) : "1";
  weight.addEventListener("input", () => { ref.weight = Number(weight.value); });
  row.appendChild(weight);

  const loopLabel = node("label", "loop");
  const loopBox = node("input");
  loopBox.type = "checkbox";
  loopBox.checked = ref.loop === true;
  loopBox.addEventListener("change", () => { ref.loop = loopBox.checked; });
  loopLabel.append(loopBox, node("span", null, "循环"));
  row.appendChild(loopLabel);

  const remove = node("button", "danger", "×");
  remove.type = "button";
  remove.title = "删除这一条";
  remove.addEventListener("click", () => {
    list.splice(list.indexOf(ref), 1);
    rerender();
  });
  row.appendChild(remove);

  return row;
}

function animeClipList(container, list, rerender) {
  container.replaceChildren();
  for (const ref of list) container.appendChild(animeClipRow(ref, list, rerender));

  const add = node("button", null, "添加 clip");
  add.type = "button";
  add.addEventListener("click", () => {
    list.push({ clip: "", weight: 1, loop: false });
    rerender();
  });
  container.appendChild(add);
}

function animeCard(title, badge) {
  const card = node("div", "anime-card");
  const top = node("div", "top");
  top.appendChild(node("span", "name", title));
  if (badge) top.appendChild(node("span", "badge", badge));
  card.appendChild(top);
  return card;
}

function animeHeading(text) {
  const box = node("div", "cfg-group");
  box.appendChild(node("h2", null, text));
  return box;
}

function renderAnime() {
  const box = el("anime-body");
  box.replaceChildren();
  const config = app.anime.raw;

  const idleCard = animeCard("待机池", config.idlePool.length + " 条");
  const idleBody = node("div", "anime-rows");
  animeClipList(idleBody, config.idlePool, renderAnime);
  idleCard.appendChild(idleBody);
  box.appendChild(idleCard);

  box.appendChild(animeHeading("动作（没配的走程序化手势）"));
  for (const name of app.anime.actions) {
    let binding = config.actions.find((item) => item && item.action === name) || null;
    const bound = binding && Array.isArray(binding.clips) ? binding.clips.length : 0;
    const card = animeCard(name, bound > 0 ? bound + " 个 clip" : "未配");
    const body = node("div", "anime-rows");

    if (binding && Array.isArray(binding.clips)) {
      animeClipList(body, binding.clips, renderAnime);
    } else {
      const add = node("button", null, "添加 clip");
      add.type = "button";
      add.addEventListener("click", () => {
        binding = { action: name, clips: [{ clip: "", weight: 1, loop: false }] };
        config.actions.push(binding);
        renderAnime();
      });
      body.appendChild(add);
    }
    card.appendChild(body);
    box.appendChild(card);
  }

  box.appendChild(animeHeading("姿态（三件套齐全才会启用）"));
  for (const poseName of ANIME_POSES) {
    const binding = config.poses.find((item) => item && item.pose === poseName) || null;
    const ready = binding && typeof binding.enter === "string" && binding.enter.trim() !== ""
      && typeof binding.exit === "string" && binding.exit.trim() !== ""
      && Array.isArray(binding.loop) && binding.loop.length > 0;
    const card = animeCard(poseName, ready ? "已启用" : "未配");

    // 只在真的编辑时才把姿态推进数组——不写一堆空条目
    const ensurePose = () => {
      let found = config.poses.find((item) => item && item.pose === poseName) || null;
      if (!found) {
        found = { pose: poseName, enter: "", loop: [], exit: "" };
        config.poses.push(found);
      }
      if (!Array.isArray(found.loop)) found.loop = [];
      return found;
    };

    for (const slot of ["enter", "exit"]) {
      const row = node("div", "anime-slot");
      row.appendChild(node("span", null, slot));
      const input = node("input");
      input.type = "text";
      input.spellcheck = false;
      input.placeholder = slot === "enter" ? "进入姿态的 clip（播一次）" : "离开姿态的 clip（播一次）";
      input.value = binding && typeof binding[slot] === "string" ? binding[slot] : "";
      input.addEventListener("input", () => { ensurePose()[slot] = input.value; });
      row.appendChild(input);
      card.appendChild(row);
    }

    const loopRow = node("div", "anime-slot");
    loopRow.appendChild(node("span", null, "loop"));
    const loopBody = node("div", "anime-rows");
    if (binding && Array.isArray(binding.loop)) {
      animeClipList(loopBody, binding.loop, renderAnime);
    } else {
      const add = node("button", null, "添加循环 clip");
      add.type = "button";
      add.addEventListener("click", () => {
        ensurePose().loop.push({ clip: "", weight: 1, loop: true });
        renderAnime();
      });
      loopBody.appendChild(add);
    }
    loopRow.appendChild(loopBody);
    card.appendChild(loopRow);

    box.appendChild(card);
  }
}

async function loadAnime() {
  // 11 个动作名以后端词表为准（单一真相在 vocabulary，ADR 0015）
  const vocabulary = await fetchJson("/v1/config", null, 8000);
  app.anime.actions = Array.isArray(vocabulary.actions) ? vocabulary.actions : [];

  let raw = null;
  let missing = false;
  try {
    raw = await fetchJson("/v1/avatar/animation", null, 15000);
  } catch (error) {
    if (String(error.message).indexOf("404") < 0) throw error;
    missing = true;
  }

  app.anime.raw = normalizeAnime(raw);
  el("anime-sub").textContent = missing
    ? "后端还没有副本"
    : "后端权威副本（Unity 连上时拉取，工程里那份只是缓存）";

  const banner = el("anime-banner");
  banner.replaceChildren();
  if (missing) {
    banner.appendChild(node("p", "note warn",
      "后端还没有动画映射副本：跑一次 Unity 客户端会自动上报，或点「粘贴导入」把现有 JSON 贴进来。"));
  }
  banner.hidden = !missing;

  renderAnime();
  return app.anime.raw;
}

function animeText() {
  return JSON.stringify(app.anime.raw, null, 2) + "\n";
}

function downloadJson(filename, text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function saveAnime() {
  const text = animeText();
  const result = await fetchJson("/v1/avatar/animation", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: text,
  }, 20000);
  createBubble("system",
    "动画映射已保存到后端（" + result.bytes + " 字节 → " + result.path + "）。Unity 下次连上就会用上。");
  await loadAnime();
}
